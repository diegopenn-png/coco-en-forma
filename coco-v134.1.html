<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0; url=/?source=pwa">
  <link rel="canonical" href="https://cocoenforma.com/">
  <title>Abriendo Coco en Forma…</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #f7fbff; color: #0c1e33; }
    main { padding: 24px; text-align: center; }
    a { color: #0c6cae; font-weight: 700; }
  </style>
  <script>
    (function () {
      var target = new URL("/", window.location.origin);
      var incoming = new URLSearchParams(window.location.search);
      target.searchParams.set("source", incoming.get("source") || "pwa");
      incoming.forEach(function (value, key) {
        if (key !== "source") target.searchParams.append(key, value);
      });
      target.hash = window.location.hash;
      window.location.replace(target.href);
    }());
  </script>
</head>
<body>
  <main>
    <p>Abriendo Coco en Forma…</p>
    <p><a href="/?source=pwa">Continuar</a></p>
  </main>
</body>
</html>
