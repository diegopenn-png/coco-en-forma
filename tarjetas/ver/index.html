<!doctype html>
<html lang="es" dir="ltr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow">
<title>Coco en Forma</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#071428;color:#fff;font:1rem system-ui,sans-serif}main{display:grid;justify-items:center;gap:1rem;padding:1rem;text-align:center}img{display:block;max-width:100%;max-height:80vh;height:auto;border-radius:.65rem}a,button{background:#ffd06d;color:#132236;border:0;border-radius:.6rem;padding:.7rem 1rem;font:700 1rem system-ui,sans-serif;text-decoration:none;cursor:pointer}a:focus-visible,button:focus-visible{outline:3px solid #fff;outline-offset:4px}[hidden]{display:none}
</style>
<script src="/i18n/reward-cards.js?v=1" defer></script>
</head>
<body><main aria-live="polite"><img id="art" alt="" hidden><a id="save" hidden></a><button id="retry" hidden></button></main>
<script>
document.addEventListener('DOMContentLoaded',()=>{
  const params=new URLSearchParams(location.search);
  const service=window.CocoRewardCards;
  const card=service.describe(params.get('id'),params.get('lang'));
  if (!card) { location.replace('/'); return; }
  document.documentElement.lang=card.lang;
  document.documentElement.dir=card.lang==='ar'?'rtl':'ltr';
  document.title=card.name+' · Coco en Forma';
  const img=document.getElementById('art'), save=document.getElementById('save'), retry=document.getElementById('retry');
  img.alt=card.name+' · '+card.motto;
  save.textContent=card.download; retry.textContent=card.retry;
  async function show() {
    retry.hidden=true;
    try {
      const url=card.lang==='es' ? '/assets/tarjetas/premium-v160127/'+card.id+'.jpg' : URL.createObjectURL(await service.jpeg(card));
      img.src=url; await img.decode(); img.hidden=false;
      save.href=url; save.download='Coco-'+card.threshold+'-'+card.lang+'.jpg'; save.hidden=false;
    } catch { retry.hidden=false; }
  }
  retry.onclick=show; show();
});
</script></body></html>
