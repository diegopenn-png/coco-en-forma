@media(max-width:480px){#cocoApp .galeriaTarjetasLogro{gap:10px}#cocoApp .tarjetaLogro{padding:7px;border-radius:18px}#cocoApp .tarjetaMini{border-radius:14px}#cocoApp .datosTarjeta{min-height:118px}#cocoApp .datosTarjeta>b{font-size:15px}#cocoApp .datosTarjeta>span:not(.estadoBloqueoTarjeta){font-size:11.5px}#cocoApp .datosTarjeta>small{font-size:10.5px}#cocoApp .descargarTarjetaCoco{font-size:11.5px!important;padding:8px 5px!important}}

/* Panel del jugador dividido en dos pestañas: retos y tarjetas */
#cocoApp .navegacionJugador{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:18px 0 16px;padding:7px;border-radius:22px;background:linear-gradient(180deg,#EAF7FE,#DDF1FB);border:2px solid #CFE7F5;box-shadow:0 4px 0 #CFE7F5}

#cocoApp .panelJugador>.caja:first-child{margin-top:0}
@keyframes cocoPanelEntra{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
/* Las tarjetas se recorren lateralmente; ya no empujan los retos hacia abajo */

#cocoApp .panelJugador .galeriaTarjetasLogro::-webkit-scrollbar-thumb{background:#9EDCF4;border-radius:999px;border:2px solid #EAF7FE}

<style id="coco-v37-launch-polish">
#cocoApp{--sombraPremium:0 14px 34px rgba(15,46,66,.11),0 5px 0 rgba(209,229,240,.95);--sombraSuave:0 9px 22px rgba(47,169,220,.12);--radioXL:26px;letter-spacing:.002em}
#cocoApp,#cocoApp button,#cocoApp input,#cocoApp table{font-family:var(--body)!important}
#cocoApp h1,#cocoApp h2,#cocoApp h3,#cocoApp .btn,#cocoApp .dato b,#cocoApp .granPuntos,#cocoApp .regla,#cocoApp .carnet .quien strong{font-family:var(--display)!important}
#cocoApp .caja{padding:24px;border-radius:var(--radioXL);border-color:#D7EAF4;box-shadow:var(--sombraPremium)}
#cocoApp h2{font-size:clamp(28px,3vw,36px);line-height:1.06;margin-bottom:10px}
#cocoApp h3{line-height:1.12}
#cocoApp p{line-height:1.55}
#cocoApp .pequeno{line-height:1.48}
#cocoApp .btn{border-radius:18px;padding:13px 19px;font-size:16px;letter-spacing:.005em;transition:transform .16s ease,box-shadow .16s ease,filter .16s ease}
#cocoApp .btn:hover:not(:disabled){transform:translateY(-2px);filter:saturate(1.08)}
#cocoApp .btn:active:not(:disabled){transform:translateY(1px)}
#cocoApp .hud{gap:10px;margin-bottom:18px}
#cocoApp .hud .dato{background:linear-gradient(180deg,#F8FCFF,#EDF7FD);border:1px solid #D9EBF5;border-radius:15px;padding:8px 14px;box-shadow:inset 0 1px 0 #fff}
#cocoApp .carnet{padding:22px 25px;border-radius:28px;box-shadow:0 8px 0 #14607F,0 20px 42px rgba(30,127,180,.2)}
#cocoApp .carnet .quien strong{font-size:29px}
#cocoApp .avatarCarnet{width:76px;height:76px}
#cocoApp .navegacionJugador{padding:8px;gap:10px;border-radius:23px;border:1px solid #D9EBF5;background:linear-gradient(180deg,#F2FAFF,#E7F4FB);box-shadow:0 8px 20px rgba(47,169,220,.08)}
#cocoApp .pestanaJugador{padding:14px 19px;border-radius:18px}
#cocoApp .pestanaJugador.activa{box-shadow:0 5px 0 rgba(47,169,220,.2),0 12px 24px rgba(47,169,220,.12)}
#cocoApp .juego{border-radius:25px;overflow:hidden;box-shadow:var(--sombraPremium);background:linear-gradient(180deg,#FFFFFF 0%,#FBFDFF 100%)}
#cocoApp .juego .emoji{min-height:118px;border-radius:23px;background:radial-gradient(circle at 50% 20%,#FFFFFF 0%,#EFF8FD 70%,#E6F2F8 100%);border:1px solid #E0EDF5;box-shadow:inset 0 1px 0 #fff,0 8px 18px rgba(47,169,220,.09)}
#cocoApp .juego h3{font-size:22px}
#cocoApp .tablero,#cocoApp .sudokuTablero,#cocoApp .sopaGrid,#cocoApp .abaco,#cocoApp .memoriaGrid{box-shadow:var(--sombraSuave)}
#cocoApp .memoriaGrid{gap:14px}
#cocoApp .memoriaCarta{border-radius:20px;overflow:hidden;border:0;background:transparent;box-shadow:0 6px 0 rgba(72,105,133,.14),0 12px 22px rgba(16,27,38,.12)}
#cocoApp .memoriaCara{border-radius:20px}
#cocoApp .memoriaDorso{background:radial-gradient(circle at 32% 22%,#A8E8FF 0,#35AEDC 39%,#1778A9 100%)!important;color:#fff!important;border:2px solid rgba(255,255,255,.7);box-shadow:inset 0 -10px 18px rgba(0,72,111,.18)}
#cocoApp .dorsoCoco{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;font-family:var(--display);font-size:26px;background:rgba(255,255,255,.94);color:#EF6C05;box-shadow:0 5px 12px rgba(0,59,95,.2)}
#cocoApp .memoriaFrente{background:linear-gradient(180deg,#FFFFFF,#F5FAFE)!important;border:2px solid #DCECF5;box-shadow:inset 0 -10px 16px rgba(214,231,241,.35)}
#cocoApp .memoriaIconoTema{display:grid;place-items:center;width:70%;height:70%;border-radius:22px;font-size:clamp(28px,5vw,44px);background:radial-gradient(circle at 30% 20%,#fff 0,#F3F9FD 70%);box-shadow:0 7px 15px rgba(21,86,119,.12),inset 0 -5px 8px rgba(206,229,241,.32)}
#cocoApp .memoriaCarta.encontrada .memoriaFrente{border-color:#9BE2B9;background:linear-gradient(180deg,#F3FFF8,#DCF8E9)!important}
#cocoApp .serieCoco{gap:12px;margin:22px 0}
#cocoApp .celdaSerie{width:60px;height:60px;border-radius:19px;background:linear-gradient(180deg,#F8FCFF,#EAF6FC);border:1px solid #D6EAF4;box-shadow:0 5px 0 rgba(47,169,220,.16);font-size:25px}
#cocoApp .celdaSerie.incognita{background:linear-gradient(180deg,#FFF8E9,#FFEBC4);border-color:#F4C66A;box-shadow:0 5px 0 rgba(239,108,5,.18)}
#cocoApp .tipoSerie{display:block;margin-top:5px;color:#6A8393;font-size:12px}
#cocoApp .operacion.op{background:linear-gradient(180deg,#FFFDF8,#FFF2D2);border:2px solid #F3D98F;border-radius:25px;padding:20px;box-shadow:0 10px 24px rgba(208,157,44,.16);font-size:clamp(38px,7vw,64px)}
#cocoApp .resp{min-height:58px;border-radius:18px;background:#F8FCFF;border:2px dashed #CFE5F1;padding:11px 16px}
#cocoApp .teclado button{border-radius:16px;box-shadow:0 4px 0 rgba(22,96,127,.14)}
#cocoApp .sudokuTablero{border-width:5px;border-radius:20px;background:#173F59;padding:4px;overflow:hidden}
#cocoApp .sudokuCelda{font-size:clamp(21px,4vw,28px);font-weight:800;background:linear-gradient(180deg,#fff,#F8FBFD)}
#cocoApp .sudokuCelda.correcta{background:linear-gradient(180deg,#F2FFF8,#DCF7E8)}
#cocoApp .sudokuNumero{border-radius:15px;box-shadow:0 4px 0 rgba(22,96,127,.14)}
#cocoApp .sopaZona{gap:22px}
#cocoApp .sopaGrid{padding:8px;border-radius:21px;background:linear-gradient(180deg,#D3EDF8,#B7DAEC)}
#cocoApp .sopaCelda{border-radius:11px;background:linear-gradient(180deg,#fff,#F4FAFD);font-weight:800;color:#173F59;box-shadow:inset 0 -3px 0 rgba(208,228,239,.85)}
#cocoApp .sopaCelda.marcando{background:linear-gradient(180deg,#FFF7DE,#FFE8A7);color:#8C4D05}
#cocoApp .sopaCelda.encontrada{background:linear-gradient(180deg,#EEFFF5,#CFF4DF);color:#176F40}
#cocoApp .palabraSopa{padding:8px 12px;border-radius:999px;background:#F4FAFE;border:1px solid #D8EAF4;font-weight:800;box-shadow:inset 0 1px 0 #fff}
#cocoApp .palabraSopa.hecha{background:#E4F8ED;border-color:#BCE8CD;color:#197847;text-decoration:none}
/* Ábaco físico: marco de madera, varillas metálicas y cuentas con volumen */
#cocoApp .abaco{position:relative;background:linear-gradient(135deg,#A46C39 0%,#7A4724 52%,#985E31 100%);border:10px solid #68401F;border-top-color:#8D572E;border-bottom-width:14px;border-radius:30px;padding:24px 18px 18px;box-shadow:inset 0 2px 0 rgba(255,255,255,.2),inset 0 -8px 18px rgba(60,28,8,.25),0 9px 0 #533016,0 22px 38px rgba(73,41,18,.25)}
#cocoApp .abaco:before,#cocoApp .abaco:after{content:"";position:absolute;left:22px;right:22px;height:7px;border-radius:999px;background:linear-gradient(180deg,#C3874D,#70401E);box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
#cocoApp .abaco:before{top:10px}#cocoApp .abaco:after{bottom:9px}
#cocoApp .varilla{position:relative;background:linear-gradient(180deg,#FFF9EE,#F4E1BE);border:1px solid #E0BE8F;border-radius:16px;padding:10px 7px 8px;box-shadow:inset 0 2px 0 rgba(255,255,255,.7),inset 0 -12px 18px rgba(192,145,86,.14);overflow:hidden}
#cocoApp .varilla:before{content:"";position:absolute;z-index:0;top:12px;bottom:57px;left:50%;width:5px;transform:translateX(-50%);border-radius:999px;background:linear-gradient(90deg,#8A8F91,#E4E9EA 42%,#858A8C);box-shadow:1px 0 2px rgba(0,0,0,.18)}
#cocoApp .cielo,#cocoApp .tierra,#cocoApp .barra,#cocoApp .digito,#cocoApp .peso{position:relative;z-index:1}
#cocoApp .barra{height:11px;background:linear-gradient(180deg,#5D3518,#A56634 48%,#5B3317);border-radius:999px;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 2px 3px rgba(60,30,10,.25)}
#cocoApp .cuenta{position:relative;z-index:2;width:50px;height:32px;border-width:2px;box-shadow:inset -7px -5px 9px rgba(0,0,0,.15),inset 6px 5px 9px rgba(255,255,255,.28),0 4px 7px rgba(0,0,0,.15)}
#cocoApp .cuenta:after{content:"";position:absolute;left:11%;right:11%;top:18%;height:20%;border-radius:50%;background:rgba(255,255,255,.22);filter:blur(1px)}
#cocoApp .cuenta.cinco{background:radial-gradient(circle at 32% 28%,#B5EEFF 0,#55C3EC 32%,#258FC1 70%,#14678F 100%)}
#cocoApp .cuenta.una{background:radial-gradient(circle at 32% 28%,#FFD7B7 0,#FFAD69 32%,#E96505 70%,#A84502 100%)}
#cocoApp .cuenta.puesta{box-shadow:inset -7px -5px 9px rgba(0,0,0,.15),inset 6px 5px 9px rgba(255,255,255,.28),0 7px 11px rgba(0,0,0,.19)}
#cocoApp .digito{background:linear-gradient(180deg,#fff,#EFF7FB);border:1px solid #D5E6EF;border-radius:12px;box-shadow:inset 0 -4px 8px rgba(210,229,240,.45);font-size:25px}
#cocoApp .peso{font-size:11px;letter-spacing:.075em}
#cocoApp .comoVa{border:1px solid #D9EAF3;box-shadow:inset 0 1px 0 #fff}
/* Clasificación más protagonista, sin exceso */
#cocoApp .rankingTitulo{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
#cocoApp .rankingTitulo h2{margin:0}
#cocoApp .rankingEstrella{display:grid;place-items:center;width:48px;height:48px;border-radius:16px;background:linear-gradient(180deg,#FFE785,#F4BE39);color:#8B5700;font-size:27px;box-shadow:0 5px 0 #D89A1B}
#cocoApp .podioRanking{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:20px 0 22px}
#cocoApp .podioPuesto{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:5px;padding:16px 10px;border-radius:22px;background:linear-gradient(180deg,#F9FCFF,#ECF7FD);border:1px solid #D6E9F3;box-shadow:0 5px 0 rgba(208,229,240,.9)}
#cocoApp .podioPuesto.puesto1{background:linear-gradient(180deg,#FFF9E8,#FFEFC0);border-color:#F2D477;transform:translateY(-5px)}
#cocoApp .podioPuesto.puesto2{background:linear-gradient(180deg,#FBFCFD,#E9EFF3)}
#cocoApp .podioPuesto.puesto3{background:linear-gradient(180deg,#FFF7F0,#F6E1D0)}
#cocoApp .podioNumero{position:absolute;top:9px;left:10px;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#173F59;color:#fff;font-family:var(--display);font-size:15px}
#cocoApp .podioAvatar img{width:72px!important;height:94px!important;border-radius:16px!important}
#cocoApp .podioPuesto b{font-family:var(--display);font-size:16px;max-width:100%;overflow:hidden;text-overflow:ellipsis}
#cocoApp .podioPuesto strong{color:#EF6C05;font-size:14px}
#cocoApp .tablaRanking th,#cocoApp .tablaRanking td{padding:13px 10px}
#cocoApp .tablaRanking .jugadorFila img{width:43px!important;height:56px!important;border-radius:10px!important;object-fit:cover!important}

  if(!APP || window.__COCO_V41__) return;
  window.__COCO_V41__=true;

  var sonidoActivo=localStorage.getItem("coco_sonido")!=="0";
  var audioCtx=null, ultimoPremio=0, ultimoError=0;

  function contextoAudio(){
    if(!sonidoActivo) return null;
    try{
      audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
      if(audioCtx.state==="suspended") audioCtx.resume();
      return audioCtx;
    }catch(e){ return null; }
  }

  function tono(freq,duracion,tipo,vol,retardo){
    var ctx=contextoAudio(); if(!ctx) return;
    var inicio=ctx.currentTime+(retardo||0);
    var osc=ctx.createOscillator(), gain=ctx.createGain();
    osc.type=tipo||"sine"; osc.frequency.setValueAtTime(freq,inicio);
    gain.gain.setValueAtTime(0.0001,inicio);
    gain.gain.exponentialRampToValueAtTime(vol||0.06,inicio+.015);
    gain.gain.exponentialRampToValueAtTime(0.0001,inicio+duracion);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(inicio); osc.stop(inicio+duracion+.03);
  }

  function sonidoBien(){
    tono(523,.16,"sine",.055,0);
    tono(659,.18,"sine",.055,.10);
    tono(784,.24,"triangle",.065,.20);
  }
  function sonidoMal(){
    tono(220,.16,"triangle",.035,0);
    tono(174,.22,"triangle",.03,.12);
  }

  function estrellas(){
    if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var iconos=["★","✦","●","◆","★","✧"];
    for(var i=0;i<12;i++){
      var s=document.createElement("span");
      s.className="cocoEstrellaPremio";
      s.textContent=iconos[i%iconos.length];
      var ang=(Math.PI*2*i/12)+(Math.random()*.25);
      var dist=75+Math.random()*95;
      s.style.setProperty("--x",Math.cos(ang)*dist+"px");
      s.style.setProperty("--y",Math.sin(ang)*dist+"px");
      s.style.setProperty("--r",(Math.random()*400-200)+"deg");
      s.style.color=["#FFC93C","#EF6C05","#2FA9DC","#2FBE85","#7C63DE"][i%5];
      APP.appendChild(s);
      setTimeout(function(n){n.remove()},1050,s);
    }
  }

  function toast(texto){
    var t=APP.querySelector(".cocoToastPremio");
    if(!t){t=document.createElement("div");t.className="cocoToastPremio";APP.appendChild(t);}
    t.textContent=texto||"¡Muy bien!";
    t.classList.add("visible");
    clearTimeout(t.__timer);
    t.__timer=setTimeout(function(){t.classList.remove("visible")},1450);
  }

  function premiar(texto){
    var ahora=Date.now(); if(ahora-ultimoPremio<850) return;
    ultimoPremio=ahora;
    if(ahora-Number(window.__cocoBaseSoundAt||0)>700) sonidoBien();
    estrellas(); toast(texto||"¡Buen trabajo!");
    var caja=APP.querySelector(".caja:not(.cocoModalFamilia)");
    if(caja){caja.classList.remove("cocoPulsoPremio");void caja.offsetWidth;caja.classList.add("cocoPulsoPremio");}
  }

  function avisarError(){
    var ahora=Date.now(); if(ahora-ultimoError<700) return;
    ultimoError=ahora;
    if(ahora-Number(window.__cocoBaseSoundAt||0)>700) sonidoMal();
  }

  function crearBotonSonido(){
    if(APP.querySelector(".cocoSonidoBtn")) return;
    var b=document.createElement("button");
    b.className="cocoSonidoBtn"; b.type="button";
    b.setAttribute("aria-label",sonidoActivo?"Desactivar sonidos":"Activar sonidos");
    b.title=sonidoActivo?"Sonidos activados":"Sonidos desactivados";
    b.textContent=sonidoActivo?"🔊":"🔇";
    b.onclick=function(){
      sonidoActivo=!sonidoActivo;
      localStorage.setItem("coco_sonido",sonidoActivo?"1":"0");
      b.textContent=sonidoActivo?"🔊":"🔇";
      b.title=sonidoActivo?"Sonidos activados":"Sonidos desactivados";
      b.setAttribute("aria-label",sonidoActivo?"Desactivar sonidos":"Activar sonidos");
      if(sonidoActivo){tono(660,.14,"sine",.05,0);tono(880,.18,"sine",.05,.1);}
    };
    APP.appendChild(b);
  }

  function hashPin(pin){
    var data=new TextEncoder().encode("coco-familia-"+pin);
    return crypto.subtle.digest("SHA-256",data).then(function(buf){
      return Array.from(new Uint8Array(buf)).map(function(x){return x.toString(16).padStart(2,"0")}).join("");
    });
  }

  function cerrarModal(){
    var f=APP.querySelector(".cocoModalFondo"); if(f) f.remove();
  }

  function baseModal(titulo){
    cerrarModal();
    var fondo=document.createElement("div"); fondo.className="cocoModalFondo";
    var modal=document.createElement("section"); modal.className="cocoModalFamilia"; modal.setAttribute("role","dialog"); modal.setAttribute("aria-modal","true");
    modal.innerHTML='<div class="cocoModalCab"><div><h2>'+titulo+'</h2><p class="pequeno apagado" style="margin:3px 0 0">Resumen sencillo para acompañar el progreso.</p></div><button type="button" class="btn plano cocoCerrar" aria-label="Cerrar">×</button></div><div class="cocoModalContenido"></div>';
    fondo.appendChild(modal); APP.appendChild(fondo);
    modal.querySelector(".cocoCerrar").onclick=cerrarModal;
    fondo.addEventListener("click",function(e){if(e.target===fondo)cerrarModal()});
    document.addEventListener("keydown",function esc(e){if(e.key==="Escape"){cerrarModal();document.removeEventListener("keydown",esc)}});
    return modal.querySelector(".cocoModalContenido");
  }

  function pedirPin(){
    var contenido=baseModal("Zona familiar");
    var existe=!!localStorage.getItem("coco_pin_familia");
    contenido.innerHTML='<div class="cocoPinCaja"><p>'+(existe?'Introduce el PIN familiar de 4 cifras.':'Crea un PIN familiar de 4 cifras para evitar que el panel se abra por accidente.')+'</p><input inputmode="numeric" pattern="[0-9]*" maxlength="4" aria-label="PIN familiar" placeholder="••••"><button type="button" class="btn lima" style="margin-top:13px">'+(existe?'Abrir informe':'Crear PIN y abrir')+'</button><p class="pequeno apagado">Este PIN protege solo de accesos casuales en este dispositivo; no sustituye una contraseña de cuenta.</p><div class="aviso mal" style="display:none"></div></div>';
    var inp=contenido.querySelector("input"), btn=contenido.querySelector("button"), err=contenido.querySelector(".aviso");
    inp.focus();
    async function seguir(){
      var pin=(inp.value||"").replace(/\D/g,"");
      if(pin.length!==4){err.style.display="block";err.textContent="Escribe exactamente 4 cifras.";return;}
      var h=await hashPin(pin), guardado=localStorage.getItem("coco_pin_familia");
      if(!guardado){localStorage.setItem("coco_pin_familia",h);mostrarInforme();}
      else if(h===guardado)mostrarInforme();
      else{err.style.display="block";err.textContent="El PIN no es correcto.";inp.select();avisarError();}
    }
    btn.onclick=seguir; inp.addEventListener("keydown",function(e){if(e.key==="Enter")seguir()});
  }

  function fechaLocal(iso){
    var d=new Date(iso); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }

  function nombreJuego(id){
    var mapa={
      numeros:"Une los números · Coco en Forma — Conecta la secuencia sin repetir casillas. Entrena planificación, atención visual y coordinación.",calculo:"Cálculo rápido",palabras:"Palabras",
      zip:"Camino ZIP",abaco:"Ábaco",series:"Series",memoria:"Memoria",
      sudoku:"Sudoku · Coco en Forma — Completa el tablero sin repetir números.",sopa:"Sopa de letras"
    };
    return mapa[id]||String(id||"Otro");
  }

  async function obtenerCliente(){
    for(var i=0;i<40;i++){
      if(window.supabase && window.supabase.createClient) break;
      await new Promise(function(r){setTimeout(r,150)});
    }
    if(!window.supabase || !window.supabase.createClient) throw new Error("La conexión todavía no está disponible.");
    var cfg=window.COCO_CONFIG||{};
    return window.__COCO_SUPABASE_CLIENT||(window.__COCO_SUPABASE_CLIENT=window.supabase.createClient(cfg.url,cfg.clave,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}}));
  }

  async function mostrarInforme(){
    var contenido=baseModal("Informe familiar");
    contenido.innerHTML='<div class="cocoCarga">Preparando el informe…</div>';
    try{
      var cliente=await obtenerCliente();
      var ses=await cliente.auth.getSession(), session=ses.data&&ses.data.session;
      if(!session) throw new Error("Inicia sesión con la cuenta del jugador para ver su progreso.");
      var uid=session.user.id;
      var resultados=await Promise.all([
        cliente.from("perfiles").select("apodo,edad").eq("id",uid).single(),
        cliente.from("partidas").select("juego,puntos,creado").eq("jugador",uid).order("creado",{ascending:false}).limit(1000)
      ]);
      if(resultados[1].error) throw resultados[1].error;
      var perfil=resultados[0].data||{}, partidas=resultados[1].data||[];
      var hoy=new Date(), desde=new Date(hoy); desde.setHours(0,0,0,0); desde.setDate(desde.getDate()-6);
      var porJuego={}, total=0, puntos7=0, partidas7=0, dias={};
      partidas.forEach(function(p){
        var pts=Number(p.puntos)||0, d=new Date(p.creado);
        total+=pts; porJuego[p.juego]=(porJuego[p.juego]||0)+pts;
        if(d>=desde){puntos7+=pts;partidas7++;dias[fechaLocal(p.creado)]=1;}
      });
      var juegos=Object.keys(porJuego).sort(function(a,b){return porJuego[b]-porJuego[a]});
      var mejor=juegos.length?nombreJuego(juegos[0]):"Aún sin datos";
      var max=juegos.length?porJuego[juegos[0]]:1;
      var media=partidas.length?Math.round(total/partidas.length):0;
      var nombre=perfil.apodo||"Jugador";
      contenido.innerHTML=
        '<p><b>'+nombre+'</b>'+(perfil.edad?' · '+perfil.edad+' años':'')+'</p>'+
        '<div class="cocoStatsGrid">'+
          '<div class="cocoStat"><b>'+puntos7+'</b><span>puntos en 7 días</span></div>'+
          '<div class="cocoStat"><b>'+partidas7+'</b><span>retos en 7 días</span></div>'+
          '<div class="cocoStat"><b>'+Object.keys(dias).length+'/7</b><span>días activo</span></div>'+
          '<div class="cocoStat"><b>'+media+'</b><span>media por reto</span></div>'+
        '</div>'+
        '<h3>Fortalezas por juego</h3>'+
        '<p class="pequeno apagado">Comparación basada en los puntos acumulados, no en un diagnóstico escolar o cognitivo.</p>'+
        '<div class="cocoBarras">'+(juegos.length?juegos.map(function(j){
          var pct=Math.max(3,Math.round(porJuego[j]/max*100));
          return '<div class="cocoBarraFila"><span class="cocoBarraNombre">'+nombreJuego(j)+'</span><span class="cocoBarraPista"><i style="width:'+pct+'%"></i></span><span class="cocoBarraValor">'+porJuego[j]+' pts</span></div>';
        }).join(""):'<p class="apagado">Todavía no hay partidas registradas.</p>')+'</div>'+
        '<div class="cocoInformeNota"><b>Lectura rápida:</b> su mayor puntuación acumulada está en <b>'+mejor+'</b>. Conviene celebrar la constancia y alternar juegos, sin comparar al niño con otros jugadores.<br><br><b>Privacidad:</b> este informe usa datos que la cuenta ya guarda. No añade datos personales nuevos. El tiempo real de uso no aparece porque actualmente la aplicación no registra duración de las sesiones.</div>'+
        '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px"><button type="button" class="btn plano cocoCambiarPin">Cambiar PIN</button><button type="button" class="btn agua cocoActualizar">Actualizar</button></div>';
      contenido.querySelector(".cocoCambiarPin").onclick=function(){localStorage.removeItem("coco_pin_familia");pedirPin();};
      contenido.querySelector(".cocoActualizar").onclick=mostrarInforme;
    }catch(e){
      contenido.innerHTML='<div class="aviso mal">'+String(e&&e.message?e.message:e)+'</div><p class="pequeno apagado">Vuelve a la pantalla principal, inicia sesión y prueba otra vez.</p>';
    }
  }

  function insertarBotonFamilia(){
    var carnet=APP.querySelector(".carnet");
    if(!carnet || APP.querySelector(".cocoFamiliaBtn")) return;
    var zona=carnet.querySelector(".cocoHerramientasFamilia");
    if(!zona){zona=document.createElement("div");zona.className="cocoHerramientasFamilia";zona.style.marginLeft="auto";carnet.appendChild(zona);}
    var b=document.createElement("button");
    b.type="button"; b.className="btn plano mini cocoFamiliaBtn cocoBtnIcono";
    b.innerHTML="👨‍👩‍👧 <span>Zona familiar</span>";
    b.onclick=pedirPin; zona.appendChild(b);
  }

  function evaluarNodo(n,incluirDescendientes){
    if(!n || n.nodeType!==1) return;
    var selectorBien=".aviso.bien,.sudokuCelda.correcta,.sopaCelda.encontrada,.memoriaCarta.encontrada";
    var selectorMal=".aviso.mal,.sudokuCelda.error";
    var bien=n.matches&&n.matches(selectorBien)?n:(incluirDescendientes&&n.querySelector?n.querySelector(selectorBien):null);
    var mal=n.matches&&n.matches(selectorMal)?n:(incluirDescendientes&&n.querySelector?n.querySelector(selectorMal):null);
    if(bien){var texto=(bien.textContent||"").toLowerCase();premiar(texto.indexOf("logro")>=0?"¡Nuevo logro!":"¡Muy bien!");}
    if(mal) avisarError();
  }

  crearBotonSonido();
  insertarBotonFamilia();

  var obs=new MutationObserver(function(cambios){
    insertarBotonFamilia();
    cambios.forEach(function(c){
      if(c.type==="attributes") evaluarNodo(c.target,false);
      Array.prototype.forEach.call(c.addedNodes||[],function(n){evaluarNodo(n,true);});
    });
  });
  obs.observe(APP,{childList:true,subtree:true,attributes:true,attributeFilter:["class"]});

  document.addEventListener("pointerdown",function(){contextoAudio()},{once:true,passive:true});
})();
</script>

<script id="coco-v80-funciones">
(function(){
  "use strict";
  if(window.__COCO_V80__) return;
  window.__COCO_V80__=true;

  var feedbackTimer=null;
  window.cocoFeedbackGlobal=function(tipo){
    var app=document.getElementById("cocoApp");
    if(!app)return;
    var box=app.querySelector(".cocoFeedbackGlobal");
    if(!box){
      box=document.createElement("div");
      box.className="cocoFeedbackGlobal";
      box.setAttribute("role","status");
      box.setAttribute("aria-live","polite");
      app.appendChild(box);
    }
    clearTimeout(feedbackTimer);
    box.className="cocoFeedbackGlobal "+tipo;
    box.textContent=tipo==="bien"?"¡CORRECTO!":"¡INCORRECTO!";
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){box.classList.add("visible")});
    });
    feedbackTimer=setTimeout(function(){
      box.classList.remove("visible");
    },1100);
  };

  function mejorarPassword(input){
    if(!input || input.dataset.cocoMonkey==="1")return;
    input.dataset.cocoMonkey="1";
    input.setAttribute("autocapitalize","none");
    input.setAttribute("autocorrect","off");
    input.setAttribute("spellcheck","false");

    var wrap=document.createElement("div");
    wrap.className="cocoPasswordWrap";
    input.parentNode.insertBefore(wrap,input);
    wrap.appendChild(input);

    var btn=document.createElement("button");
    btn.type="button";
    btn.className="cocoPasswordMonkey";
    btn.textContent="Mostrar";
    btn.setAttribute("aria-label","Mostrar contraseña");
    btn.setAttribute("aria-pressed","false");
    wrap.appendChild(btn);

    btn.addEventListener("click",function(ev){
      ev.preventDefault();
      ev.stopPropagation();
      var mostrar=input.type==="password";
      input.type=mostrar?"text":"password";
      btn.textContent=mostrar?"Ocultar":"Mostrar";

    msg.setAttribute("aria-live","polite");

        msg.className="cocoPasswordCoincide no";

    p2.addEventListener("input",revisar);
    revisar();
  }

  function preparar(){
    var app=document.getElementById("cocoApp");
    if(!app)return;
    app.querySelectorAll('input[type="password"]').forEach(mejorarPassword);

  }

<script id="coco-v81-interacciones">
(function(){
  "use strict";
  if(window.__COCO_V81__)return;
  window.__COCO_V81__=true;

  var ctx=null;
  function audio(){
    if(!ctx){
      var AC=window.AudioContext||window.webkitAudioContext;
      if(AC)ctx=new AC();
    }
    if(ctx&&ctx.state==="suspended")ctx.resume();
    return ctx;
  }
  function tono(frecuencia,inicio,duracion,tipo,volumen){
    var c=audio();
    if(!c)return;
    var o=c.createOscillator(),g=c.createGain();
    o.type=tipo||"sine";
    o.frequency.setValueAtTime(frecuencia,c.currentTime+inicio);
    g.gain.setValueAtTime(.0001,c.currentTime+inicio);
    g.gain.exponentialRampToValueAtTime(volumen||.08,c.currentTime+inicio+.012);
    g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+inicio+duracion);
    o.connect(g);g.connect(c.destination);
    o.start(c.currentTime+inicio);
    o.stop(c.currentTime+inicio+duracion+.03);
  }
  function sonidoCorrecto(){
    tono(523.25,0,.22,"triangle",.07);
    tono(659.25,.09,.24,"triangle",.075);
    tono(783.99,.18,.28,"triangle",.08);
    tono(1046.5,.29,.38,"sine",.055);
  }
  function sonidoIncorrecto(){
    tono(220,0,.22,"sawtooth",.055);
    tono(174.61,.12,.28,"sawtooth",.05);
  }
  function confeti(){
    var app=document.getElementById("cocoApp");
    if(!app)return;
    var capa=document.createElement("div");
    capa.className="cocoConfetiV81";
    var tonos=["#FFD33D","#38D996","#39BDF2","#FF6F7D","#9C75F4","#FF9A3D"];
    for(var i=0;i<74;i++){
      var p=document.createElement("i");
      p.style.left=(Math.random()*100)+"vw";
      p.style.background=tonos[i%tonos.length];
      p.style.setProperty("--x",((Math.random()-.5)*280)+"px");
      p.style.setProperty("--rot",((Math.random()*1200)-600)+"deg");
      p.style.setProperty("--dur",(1.8+Math.random()*1.4)+"s");
      p.style.animationDelay=(Math.random()*.25)+"s";
      if(i%4===0)p.style.borderRadius="50%";
      capa.appendChild(p);
    }
    app.appendChild(capa);
    setTimeout(function(){capa.remove()},3600);
  }

  var feedbackAnterior=window.cocoFeedbackGlobal;
  window.cocoFeedbackGlobal=function(tipo){
    if(feedbackAnterior)feedbackAnterior(tipo);
    var box=document.querySelector("#cocoApp .cocoFeedbackGlobal");
    if(box)box.textContent=tipo==="bien"?"¡CORRECTO!":"¡INCORRECTO!";
    if(tipo==="bien"){sonidoCorrecto();confeti()}
    else sonidoIncorrecto();
  };

  function manoEnCuenta(cuenta){
    var abaco=cuenta&&cuenta.closest(".abaco");
    if(!abaco)return;
    abaco.style.position="relative";
    var r=abaco.getBoundingClientRect(),cr=cuenta.getBoundingClientRect();
    var mano=document.createElement("span");
    mano.className="cocoManoAbaco";
    mano.textContent="🫴";
    mano.style.left=((cr.left+cr.width/2)-r.left)+"px";
    mano.style.top=((cr.top+cr.height/2)-r.top)+"px";
    var esSuperior=cuenta.classList.contains("cinco");
    var puesta=cuenta.classList.contains("puesta");
    var dir=esSuperior?(puesta?-32:32):(puesta?34:-34);
    mano.style.setProperty("--mano-dir",dir+"px");
    abaco.appendChild(mano);
    requestAnimationFrame(function(){mano.classList.add("activa")});
    setTimeout(function(){mano.remove()},850);
  }

  document.addEventListener("pointerdown",function(ev){
    var cuenta=ev.target.closest&&ev.target.closest("#cocoApp .abaco .cuenta");
    if(cuenta)manoEnCuenta(cuenta);
  },true);
})();
</script>

<script id="coco-v82-funciones">
(function(){

  function ajustarAbaco(){
    var app=document.getElementById("cocoApp");

    app.querySelectorAll(".abaco").forEach(function(abaco){
      var cols=abaco.querySelectorAll(".varilla").length;
      if(cols)abaco.setAttribute("data-cols",String(cols));

  function ajustarRanking(){
    var app=document.getElementById("cocoApp");
    if(!app)return;
    var tabla=app.querySelector(".tablaRanking");
    if(!tabla)return;

    var caja=tabla.closest(".caja")||tabla.parentElement;
    if(!caja||caja.querySelector(".cocoRankingCabeceraV82"))return;

    var titulo=[].slice.call(caja.querySelectorAll("h2,h3")).find(function(el){
      return /clasificaci|ranking/i.test(el.textContent||"");
    });
    if(!titulo)return;

    var botones=[].slice.call(caja.querySelectorAll("button,.btn"));
    var volver=botones.find(function(el){
      return /volver/i.test(el.textContent||"");
    });

    var estrella=[].slice.call(caja.querySelectorAll("button,.btn,span,div")).find(function(el){
      var txt=(el.textContent||"").trim();
      return txt==="⭐" || /estrella/i.test(el.getAttribute("aria-label")||"");
    });

    var header=document.createElement("div");
    header.className="cocoRankingCabeceraV82";

    var left=document.createElement("div");
    left.className="cocoRankingTituloV82";

    var right=document.createElement("div");
    right.className="cocoRankingAccionesV82";

    titulo.parentNode.insertBefore(header,titulo);
    left.appendChild(titulo);
    header.appendChild(left);
    header.appendChild(right);

    if(estrella && estrella!==titulo && estrella.parentNode){
      right.appendChild(estrella);
    }

    if(volver && volver.parentNode){
      volver.classList.add("cocoRankingVolverV82");
      right.appendChild(volver);
    }else{
      var btn=document.createElement("button");

 async function cargarCuentaMed(){
   var cli=cocoMedCliente(),ses=null;

   /* Safari puede tardar unos milisegundos en compartir la sesión
      entre el acceso principal y el módulo Coco Med. */
   for(var intento=0;intento<8;intento++){
     var lectura=await cli.auth.getSession();
     ses=lectura&&lectura.data?lectura.data.session:null;
     if(ses)break;
     await new Promise(function(resolve){setTimeout(resolve,180)});
   }

   medSessionCache=ses||null;
   if(!medSessionCache)throw new Error("No se encontró la sesión principal de Coco en Forma.");
   if(window.CocoDailyV134&&typeof window.CocoDailyV134.setUser==="function")window.CocoDailyV134.setUser(medSessionCache.user.id,medSessionCache.user.email||"");

   var uid=medSessionCache.user.id;
   var nombreBase=
     (medSessionCache.user.user_metadata&&
       (medSessionCache.user.user_metadata.apodo||
        medSessionCache.user.user_metadata.username))||
     (medSessionCache.user.email||"jugador").split("@")[0];

   /* El perfil principal es útil, pero no debe bloquear Coco Med
      si la consulta tarda o no devuelve datos. */
   try{
     var principal=await cli.from("perfiles")
       .select("apodo")
       .eq("id",uid)
       .maybeSingle();
     if(principal&&principal.data&&principal.data.apodo){
       nombreBase=principal.data.apodo;
     }
   }catch(e){}

   var perfil=await cli.from("coco_med_profiles")
     .select("username,display_name,country")
     .eq("user_id",uid)
     .maybeSingle();

   if(perfil.error)throw new Error("Perfil médico: "+perfil.error.message);

   if(perfil.data){
     medProfileCache=perfil.data;
   }else{
     var nombreSeguro=String(nombreBase||"jugador")
       .trim()
       .replace(/\s+/g,"_")
       .replace(/[^a-zA-Z0-9._-]/g,"")
       .slice(0,38);

     if(!nombreSeguro)nombreSeguro="jugador";
     nombreSeguro=nombreSeguro+"_"+uid.slice(0,6);

     var creado=await cli.from("coco_med_profiles")
       .insert({
         user_id:uid,
         username:nombreSeguro,
         display_name:String(nombreBase||"Jugador Coco").slice(0,60)
       })
       .select("username,display_name,country")
       .single();

     if(creado.error)throw new Error("Creación del perfil médico: "+creado.error.message);
     medProfileCache=creado.data;
   }

   var progreso=await cli.from("coco_med_progress")
     .select("correct_answers,answered_questions,exams_completed,best_score,stage_progress,current_streak,last_activity")
     .eq("user_id",uid)
     .maybeSingle();

   if(progreso.error)throw new Error("Progreso médico: "+progreso.error.message);

   if(progreso.data){
     medProgressCache={
       aciertos:Number(progreso.data.correct_answers)||0,
       respondidas:Number(progreso.data.answered_questions)||0,
       examenes:Number(progreso.data.exams_completed)||0,
       mejor:Number(progreso.data.best_score)||0,
       racha:Number(progreso.data.current_streak)||0,
       lastActivity:progreso.data.last_activity||null,
       programa:normalizarProgramaMed(progreso.data.stage_progress)
     };
   }else{
     var nuevo=await cli.from("coco_med_progress")
       .insert({
         user_id:uid,
         correct_answers:0,
         answered_questions:0,
         exams_completed:0,
         best_score:0,
         stage_progress:{},
         current_streak:0,
         last_activity:new Date().toISOString()
       })
       .select("correct_answers,answered_questions,exams_completed,best_score,current_streak")
       .single();

     if(nuevo.error)throw new Error("Creación del progreso médico: "+nuevo.error.message);

     medProgressCache={
       aciertos:0,
       respondidas:0,
       examenes:0,
       mejor:0,
       racha:0,
       lastActivity:null,
       programa:normalizarProgramaMed({})
     };
   }

   return true;
 }

 function normalizarProgramaMed(p){
   p=p&&typeof p==="object"?p:{};
   return {
     answered_ids:Array.isArray(p.answered_ids)?Array.from(new Set(p.answered_ids)):[],
     correct_ids:Array.isArray(p.correct_ids)?Array.from(new Set(p.correct_ids)):[],
     active_days:Array.isArray(p.active_days)?Array.from(new Set(p.active_days)).sort():[],
     passed_exams:Number(p.passed_exams)||0,
     passed_by_stage:p.passed_by_stage&&typeof p.passed_by_stage==="object"?p.passed_by_stage:{}
   };
 }

 function rachaDiasMed(dias){
   dias=Array.isArray(dias)?Array.from(new Set(dias)).sort():[];
   if(!dias.length)return 0;
   var set=new Set(dias),racha=0,fecha=new Date();
   for(var i=0;i<366;i++){
     var clave=fecha.toISOString().slice(0,10);
     if(set.has(clave)){racha++;fecha.setDate(fecha.getDate()-1)}
     else if(i===0){fecha.setDate(fecha.getDate()-1);continue}
     else break;
   }
   return racha;
 }

 function metricasProgramaMed(){
   var d=datos(),p=normalizarProgramaMed(d.programa);
   var total=banco.length||1;
   var cobertura=Math.min(100,Math.round(100*p.answered_ids.length/total));
   var precision=d.respondidas?Math.round(100*d.aciertos/d.respondidas):0;
   var etapas=etapasOrdenadasMed();
   var etapasAprobadas=etapas.filter(function(e){return Number(p.passed_by_stage[e]||0)>0}).length;
   return {
     cobertura:cobertura,
     precision:precision,
     diasActivos:p.active_days.length,
     rachaDias:rachaDiasMed(p.active_days),
     aprobados:p.passed_exams,
     etapasAprobadas:etapasAprobadas,
     totalEtapas:etapas.length,
     respondidasUnicas:p.answered_ids.length
   };
 }

 function mezclar(lista){
   var copia=Array.isArray(lista)?lista.slice():[];
   for(var i=copia.length-1;i>0;i--){
     var j=Math.floor(Math.random()*(i+1));
     var temporal=copia[i];
     copia[i]=copia[j];
     copia[j]=temporal;
   }
   return copia;
 }

 function prepararPreguntaMed(q){
   var copia={
     id:q.id,
     stage:q.stage,
     subject:q.subject,
     difficulty:q.difficulty,
     stem:q.stem,
     options:Array.isArray(q.options)?q.options.slice():[],
     answer:Number(q.answer),
     explanation:q.explanation,
     reference:q.reference
   };
   var pares=copia.options.map(function(texto,indice){
     return {texto:texto,correcta:indice===copia.answer};
   });
   pares=mezclar(pares);
   copia.options=pares.map(function(p){return p.texto});
   copia.answer=pares.findIndex(function(p){return p.correcta});
   return copia;
 }

   var sesion=lectura&&lectura.data?lectura.data.session:null;
   var expiraEn=sesion&&sesion.expires_at?Number(sesion.expires_at)*1000:0;
   var necesitaRenovar=Boolean(forzarRenovacion)||!sesion||!sesion.access_token||(expiraEn&&expiraEn<Date.now()+120000);
   if(necesitaRenovar){
     var renovada=await cliente.auth.refreshSession();
     if(renovada&&renovada.data&&renovada.data.session)sesion=renovada.data.session;
     else if(renovada&&renovada.error)throw renovada.error;
   }
   if(!sesion||!sesion.access_token)throw new Error("Tu sesión ha caducado. Vuelve a entrar en Coco en Forma.");
   medSessionCache=sesion;

       headers:{
         "Content-Type":"application/json",
         "Accept":"application/json",
         "Authorization":"Bearer "+token

     };

   }
   var respuesta=await fetch(endpoint,opciones(sesion.access_token));

}

}
#cocoApp .cocoArcadeProgressWrap{margin-bottom:13px;padding:11px 13px;border:1px solid #d5e8f2;border-radius:16px;background:#fff;box-shadow:0 4px 0 #dcecf3}
#cocoApp .cocoArcadeProgressMeta{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:7px;color:#516e7e;font-size:11px;font-weight:900}
#cocoApp .cocoArcadeProgress{height:11px;overflow:hidden;border-radius:999px;background:#e5f0f5}
#cocoApp .cocoArcadeProgress>span{width:0;height:100%;display:block;border-radius:inherit;background:linear-gradient(90deg,#2fa9dc,#2fbe85);transition:width .25s ease}

#cocoApp .cocoArcadeQuestion:before{content:"";width:150px;height:150px;position:absolute;right:-70px;top:-80px;border:24px solid rgba(47,169,220,.055);border-radius:50%;pointer-events:none}

#cocoApp .cocoArcadePrompt{margin:12px 0 18px!important;color:var(--arcade-ink)!important;font-size:clamp(25px,4vw,38px)!important;line-height:1.08!important}
#cocoApp .cocoArcadeOptions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

/* Crucigrama */
#cocoApp .cocoCrossLayout{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(260px,.85fr);gap:14px;align-items:start}
#cocoApp .cocoCrossBoardWrap{padding:12px;border:2px solid #cfe7f4;border-radius:22px;background:#dff3fb;box-shadow:0 5px 0 #c6e3ef;overflow:auto}

#cocoApp .cocoCrossCell input{width:100%!important;height:100%!important;min-height:0!important;padding:0!important;border:0!important;border-radius:4px!important;background:transparent!important;color:#17394b!important;font-family:var(--display)!important;font-size:clamp(13px,3vw,24px)!important;font-weight:900;text-align:center;text-transform:uppercase!important;box-shadow:none!important}

#cocoApp .cocoCrossCell.bad{background:#fff0e8;box-shadow:inset 0 0 0 2px #ef8c51}
#cocoApp .cocoCrossNum{position:absolute;left:2px;top:1px;z-index:2;color:#426578!important;font-size:7px!important;font-weight:900;line-height:1!important;pointer-events:none}

#cocoApp .cocoCrossActions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* Reto Tiempo */
#cocoApp .cocoTimeArena{display:grid;place-items:center;min-height:340px;padding:24px;border:2px solid #cfe7f4;border-radius:26px;background:radial-gradient(circle at 50% 44%,rgba(255,201,60,.22),transparent 28%),linear-gradient(145deg,#f2fbff,#fff7e4);box-shadow:0 7px 0 #d6e9f2;text-align:center}
#cocoApp .cocoTimeClock{width:100px;height:100px;margin-bottom:12px;display:grid;place-items:center;border:8px solid #fff;border-radius:50%;background:conic-gradient(#ef6c05 var(--time-progress,100%),#dfeef4 0);box-shadow:0 7px 0 #cbdfe8,0 15px 25px rgba(22,76,99,.13);font-family:var(--display)!important;font-size:31px!important;color:#17394b!important;font-variant-numeric:tabular-nums}

#cocoApp .cocoTimeChoice:active{transform:translateY(4px);box-shadow:0 1px 0 #cfe4ed}
#cocoApp .cocoTimeChoice.correct{border-color:#55c58f;background:#e4f8ee;color:#176f50;box-shadow:0 5px 0 #a8ddc5}
#cocoApp .cocoTimeChoice.wrong{border-color:#eb959b;background:#fff0f1;color:#9b3037;box-shadow:0 5px 0 #eec0c4}
#cocoApp .cocoTimeChoice.correct{border-color:#5bc797;background:#e7f9f0;color:#116c4b;box-shadow:0 4px 0 #a8dfc7}
#cocoApp .cocoTimeChoice.wrong{border-color:#ec8f96;background:#fff0f1;color:#9a2c34;box-shadow:0 4px 0 #efc3c6}
#cocoApp .cocoTimeChoice:disabled{cursor:default;transform:none}

/* Verdadero o falso */
#cocoApp .cocoTrueFalse{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
#cocoApp .cocoTrueFalse button{min-height:112px;border:0;border-radius:24px;color:#fff;font-family:var(--display)!important;font-size:clamp(24px,5vw,36px)!important;font-weight:900;cursor:pointer}
#cocoApp .cocoTrueBtn{background:linear-gradient(145deg,#37cd91,#219e6b);box-shadow:0 7px 0 #177c52}
#cocoApp .cocoFalseBtn{background:linear-gradient(145deg,#f06972,#d8454e);box-shadow:0 7px 0 #a72d34}
#cocoApp .cocoTrueFalse button.correct{outline:5px solid #ffc93c;outline-offset:3px;filter:saturate(1.2)}
#cocoApp .cocoTrueFalse button.wrong{opacity:.52;filter:grayscale(.25)}
#cocoApp .cocoTrueFalse button.correct{outline:5px solid rgba(255,255,255,.88);outline-offset:-10px}
#cocoApp .cocoTrueFalse button.wrong{filter:saturate(.55);opacity:.68}

/* Fútbol */
#cocoApp .cocoGoalScene{padding:20px;border:2px solid #a9dfc3;border-radius:26px;background:linear-gradient(180deg,#a9e4fa 0 34%,#54ba78 35% 100%);box-shadow:0 7px 0 #9fcfb7;overflow:hidden}
#cocoApp .cocoGoal{width:min(720px,100%);aspect-ratio:2/1;margin:auto;padding:12px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:7px;border:9px solid #fff;border-bottom-width:14px;background:repeating-linear-gradient(45deg,rgba(255,255,255,.24) 0 2px,transparent 2px 13px);box-shadow:0 9px 0 rgba(26,93,57,.35)}

#cocoApp .cocoBasketScene .cocoArcadeFeedback.visible,
#cocoApp .cocoGoalScene .cocoArcadeFeedback.visible,
