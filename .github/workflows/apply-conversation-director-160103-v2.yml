name: Apply Eterna conversation director 160103 v2

on:
  push:
    branches:
      - feat/eterna-conversation-director-160103

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply director patch
        run: node tools/apply-conversation-director-160103.mjs
      - name: Syntax check Worker
        run: node --check eterna-worker/src/index.js
      - name: Conversation director regression checks
        run: node qa/eterna/conversation-director-v1.test.mjs
      - name: Existing Eterna tests
        run: |
          if [ -f eterna-worker/package.json ]; then
            cd eterna-worker
            npm install --ignore-scripts
            npm test --if-present
          fi
      - name: Commit patched Worker
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add eterna-worker/src/index.js
          git commit -m 'feat(eterna): add conversation director v1'
          git push origin HEAD:feat/eterna-conversation-director-160103
