name: Eterna published-library source reconciliation
on:
  push:
    branches: ["feat/eterna-library-first-202609"]
    paths: [".github/workflows/eterna-library-audit-snapshot.yml"]
permissions:
  contents: read
jobs:
  source-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a877d730a018fce369b5b262310cd8182439a7bc
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read exact published source and repeat regression, no external services
        shell: bash
        run: |
          set -o pipefail
          mkdir -p published-source
          test "$(git rev-parse HEAD)" = "a877d730a018fce369b5b262310cd8182439a7bc"
          git archive --format=tar.gz HEAD > published-source/source.tar.gz
          git rev-parse HEAD > published-source/commit.txt
          cd eterna-worker
          npm run check > ../published-source/regression.txt
          tail -10 ../published-source/regression.txt
      - name: Preserve exact public source; no environment or credentials
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eterna-published-library-source
          path: published-source
          retention-days: 7
          if-no-files-found: error
