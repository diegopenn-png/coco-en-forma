name: Deploy Eterna Worker 160.91.7

on:
  push:
    branches:
      - main
    paths:
      - ".github/release-eterna-160917"

permissions:
  contents: read

concurrency:
  group: eterna-worker-production
  cancel-in-progress: false

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_INPUT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_VERSION_ID: 43445f43-1d21-48dc-9742-874edc08621c
      EXPECTED_VERSION: 160.91.7-homework-thread-continuity
      WORKER_NAME: coco-eterna-v159
      PRODUCTION_HEALTH_URL: https://coco-eterna-v159.chatinmobiliario.workers.dev/health
      PREVIEW_HEALTH_URL: https://43445f43-coco-eterna-v159.chatinmobiliario.workers.dev/health

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "CLOUDFLARE_API_TOKEN is not configured" >&2
            exit 1
          fi
          if [[ -z "${CLOUDFLARE_ACCOUNT_INPUT:-}" ]]; then
            echo "CLOUDFLARE_ACCOUNT_ID is not configured" >&2
            exit 1
          fi

          clean_token="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          if [[ -z "$clean_token" ]]; then
            echo "CLOUDFLARE_API_TOKEN contains no usable token value" >&2
            exit 1
          fi
          echo "::add-mask::$clean_token"
          echo "CLOUDFLARE_API_TOKEN=${clean_token}" >> "$GITHUB_ENV"

          account_id="${CLOUDFLARE_ACCOUNT_INPUT#https://dash.cloudflare.com/}"
          account_id="${account_id%%/*}"
          if [[ ! "$account_id" =~ ^[0-9a-fA-F]{32}$ ]]; then
            echo "CLOUDFLARE_ACCOUNT_ID must contain a 32-character account ID or a Cloudflare dashboard URL" >&2
            exit 1
          fi
          echo "::add-mask::$account_id"
          echo "CLOUDFLARE_ACCOUNT_ID=${account_id}" >> "$GITHUB_ENV"

      - name: Install Worker tooling
        working-directory: eterna-worker
        run: npm install

      - name: Run complete regression suite
        working-directory: eterna-worker
        run: npm run check

      - name: Verify the tested preview version
        shell: bash
        run: |
          preview_payload="$(curl --fail --silent --show-error --max-time 20 "$PREVIEW_HEALTH_URL")"
          node -e '
            const payload = JSON.parse(process.argv[1]);
            if (!payload.ok || payload.version !== process.env.EXPECTED_VERSION) {
              console.error("Unexpected preview health payload", payload);
              process.exit(1);
            }
          ' "$preview_payload"

      - name: Deploy tested version to production
        working-directory: eterna-worker
        shell: bash
        run: |
          npx wrangler versions deploy \
            "${TARGET_VERSION_ID}@100%" \
            --name "$WORKER_NAME" \
            --message "Eterna 160.91.7 homework thread continuity" \
            --yes

      - name: Verify production or roll back automatically
        working-directory: eterna-worker
        shell: bash
        run: |
          healthy=false
          for attempt in 1 2 3 4 5 6; do
            payload="$(curl --silent --show-error --max-time 20 "$PRODUCTION_HEALTH_URL" || true)"
            if node -e '
              try {
                const payload = JSON.parse(process.argv[1]);
                process.exit(payload.ok && payload.version === process.env.EXPECTED_VERSION ? 0 : 1);
              } catch {
                process.exit(1);
              }
            ' "$payload"; then
              healthy=true
              break
            fi
            sleep 5
          done

          if [[ "$healthy" != "true" ]]; then
            echo "Production health verification failed; rolling back." >&2
            npx wrangler rollback \
              --name "$WORKER_NAME" \
              --message "Automatic rollback after failed Eterna 160.91.7 health check" \
              --yes
            exit 1
          fi

          echo "Production is healthy on ${EXPECTED_VERSION}."
