name: Eterna 60 new lessons build and verification
on:
  push:
    branches: ["feat/eterna-content-370-20260912"]
    paths: ["qa/content-370/*.txt", "qa/content-370/build.py", "eterna-worker/test/content-expansion-370.test.mjs", ".github/workflows/eterna-content-370-build.yml"]
permissions:
  contents: write
concurrency:
  group: eterna-content-370-build
  cancel-in-progress: false
jobs:
  build-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 20}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Compile only sixty original lessons; preserve the no-repeat fix and all previous content
        run: python qa/content-370/build.py
      - name: All historical regressions and every new lesson/course/mode
        run: |
          cd eterna-worker
          npm run check > ../content-370-evidence/regression.txt 2>&1
          tail -12 ../content-370-evidence/regression.txt
          grep -q '^# fail 0$' ../content-370-evidence/regression.txt
      - name: Commit only the verified source and its explicit review ledger to isolated branch
        run: |
          python - <<'PY'
          import subprocess
          allowed={'eterna-worker/src/index.js','eterna-worker/src/library/content-v1.js','eterna-worker/src/library/runtime-v1.js','eterna-worker/test/library-first.test.mjs','eterna-worker/test/sprint-harness.mjs','eterna-worker/test/curriculum-traceability.test.mjs','qa/library/lessons-v1.json'}
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed<=allowed,changed
          PY
          test "$GITHUB_REF" = "refs/heads/feat/eterna-content-370-20260912"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- eterna-worker/src/index.js eterna-worker/src/library/content-v1.js eterna-worker/src/library/runtime-v1.js eterna-worker/test/library-first.test.mjs eterna-worker/test/sprint-harness.mjs eterna-worker/test/curriculum-traceability.test.mjs qa/library/lessons-v1.json qa/content-370/manifest.json qa/content-370/review-ledger.json
          git commit -m "content(eterna): tested 60-lesson expansion, 370 lessons and 1110 checks" -m "All 310 previous teaching objects and the no-repeat exercise factory preserved. Only immutable release selectors changed in the Worker. AI-assisted disciplinary review, not full national coverage or independent human certification. Production unchanged."
          git push origin HEAD:refs/heads/feat/eterna-content-370-20260912
      - name: Produce exact source hashes and downloadable lesson material
        run: |
          node --input-type=module <<'JS'
          import{readFileSync,writeFileSync}from'node:fs';import{createHash}from'node:crypto';import{execFileSync}from'node:child_process';import assert from'node:assert/strict';
          const manifest=JSON.parse(readFileSync('qa/content-370/manifest.json')),log=readFileSync('content-370-evidence/regression.txt','utf8');
          const pass=Number(log.match(/^# pass (\d+)$/m)[1]),fail=Number(log.match(/^# fail (\d+)$/m)[1]);assert.equal(fail,0);assert.ok(pass>779);
          const paths=['eterna-worker/src/index.js','eterna-worker/src/library/content-v1.js','eterna-worker/src/library/runtime-v1.js','eterna-worker/src/library/procedural-v1.js','eterna-worker/src/library/compass-data-v1.js','eterna-worker/src/library/curricular-compass-v1.js','eterna-worker/test/library-first.test.mjs','eterna-worker/test/sprint-harness.mjs','eterna-worker/test/curriculum-traceability.test.mjs','eterna-worker/test/content-expansion-370.test.mjs','qa/library/lessons-v1.json','qa/content-370/manifest.json','qa/content-370/review-ledger.json'];
          const blobs=Object.fromEntries(paths.map(p=>[p,{sha:execFileSync('git',['hash-object',p],{encoding:'utf8'}).trim(),sha256:createHash('sha256').update(readFileSync(p)).digest('hex')}]));
          const report={...manifest,tested_commit:execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),tests_passed:pass,tests_failed:fail,production_changed:false,blobs};
          writeFileSync('content-370-evidence/report.json',JSON.stringify(report,null,2));
          writeFileSync('content-370-evidence/new-60-lessons.json',JSON.stringify(JSON.parse(readFileSync('qa/library/lessons-v1.json')).slice(310),null,2));
          console.log(JSON.stringify({lessons:370,new_lessons:60,questions:1110,tests_passed:pass,tests_failed:fail,production_changed:false}));
          JS
          git archive HEAD eterna-worker/src eterna-worker/test eterna-worker/package.json eterna-worker/package-lock.json eterna-state-contract-v3.js eterna-v159.js eterna-experience-v160.js qa > content-370-evidence/tested-source.tar
      - name: Preserve actual evidence even when a check fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eterna-content-370-build
          path: content-370-evidence
          retention-days: 90
          if-no-files-found: warn
