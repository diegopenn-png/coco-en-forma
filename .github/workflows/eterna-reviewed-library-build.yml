name: Eterna reviewed 256-lesson content verification
on:
  push:
    branches: ["audit/eterna-curriculum-review-c993-20260912"]
    paths: ["qa/curriculum-review/build_reviewed.py", "qa/curriculum-review/new-*.txt", "eterna-worker/test/library-editorial-review.test.mjs", ".github/workflows/eterna-reviewed-library-build.yml"]
permissions:
  contents: write
concurrency:
  group: eterna-reviewed-library-build
  cancel-in-progress: false
jobs:
  reviewed-content-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconcile exact current protocol and the standalone polygon alias
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('qa/curriculum-review/build_reviewed.py');s=p.read_text()
          a='Preguntar o equivocarse al leer no es un motivo de vergüenza${name}. Puedes empezar con una frase corta y pedir ayuda a tu profesor en privado. No hace falta hacerlo perfecto para empezar.'
          b='Puede dar vergüenza leer o preguntar delante de otros${name}; no tienes que ocultarlo ni hacerlo perfecto. Puedes empezar con una frase corta y pedir ayuda a tu profesor en privado. No hace falta hacerlo perfecto para empezar.'
          if a in s:s=s.replace(a,b)
          s=s.replace('Acknowledge the feeling rather than negate it; preserve choice and trusted human support.','Preserve acknowledgment of the feeling, remove redundant wording and reinforce choice and trusted human support.')
          p.write_text(s)
          p=Path('qa/curriculum-review/new-primary.txt');s=p.read_text();s=s.replace('poligonos;que es un poligono|','poligonos;poligono|');p.write_text(s)
          PY
      - name: Compile only the explicit reviewed snapshot
        run: python qa/curriculum-review/build_reviewed.py
      - name: Run full regression, every lesson-mode pair and independent review checks
        shell: bash
        run: |
          set -o pipefail
          cd eterna-worker
          npm run check > ../review-build-evidence/regression.txt 2>&1
          tail -12 ../review-build-evidence/regression.txt
          grep -q '^# fail 0$' ../review-build-evidence/regression.txt
      - name: Prove frontend and microphone untouched
        run: |
          python - <<'PY'
          import subprocess
          allowed={'eterna-worker/src/index.js','eterna-worker/src/library/content-v1.js','eterna-worker/src/library/runtime-v1.js','eterna-worker/test/library-first.test.mjs','qa/library/lessons-v1.json','qa/curriculum-review/build_reviewed.py','qa/curriculum-review/new-primary.txt'}
          changes=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changes<=allowed,changes
          PY
      - name: Commit only the tested content and explicit review ledger to the isolated branch
        run: |
          test "$GITHUB_REF" = "refs/heads/audit/eterna-curriculum-review-c993-20260912"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- eterna-worker/src/index.js eterna-worker/src/library/content-v1.js eterna-worker/src/library/runtime-v1.js eterna-worker/test/library-first.test.mjs qa/library/lessons-v1.json qa/curriculum-review/corrections.json qa/curriculum-review/build_reviewed.py qa/curriculum-review/new-primary.txt
          git commit -m "content(eterna): tested 256-lesson AI-reviewed snapshot with self-contained assessments" -m "39 new micro-lessons; explicit corrections with reversible evidence; all original question identities and answer keys preserved. No human teacher certification or complete territorial curriculum claim. No production deployment."
          git push origin HEAD:refs/heads/audit/eterna-curriculum-review-c993-20260912
          node --input-type=module <<'JS'
          import{readFileSync,writeFileSync}from'node:fs';import{createHash}from'node:crypto';import{execFileSync}from'node:child_process';
          const paths=['eterna-worker/src/index.js','eterna-worker/src/library/content-v1.js','eterna-worker/src/library/runtime-v1.js','eterna-worker/test/library-first.test.mjs','eterna-worker/test/library-editorial-review.test.mjs','qa/library/lessons-v1.json','qa/curriculum-review/corrections.json'];
          const blobs=Object.fromEntries(paths.map(path=>[path,{sha:execFileSync('git',['hash-object',path],{encoding:'utf8'}).trim(),sha256:createHash('sha256').update(readFileSync(path)).digest('hex')}]));
          const log=readFileSync('review-build-evidence/regression.txt','utf8'),build=JSON.parse(readFileSync('review-build-evidence/build.json'));
          const report={...build,tested_commit:execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),tests_passed:Number(log.match(/^# pass (\d+)$/m)[1]),tests_failed:Number(log.match(/^# fail (\d+)$/m)[1]),production_modified:false,blobs};
          writeFileSync('review-build-evidence/report.json',JSON.stringify(report,null,2));
          JS
          git archive HEAD eterna-worker/src eterna-worker/test eterna-worker/package.json eterna-worker/package-lock.json eterna-state-contract-v3.js qa/curriculum-review qa/library/lessons-v1.json > review-build-evidence/tested-source.tar
      - name: Preserve actual results even if a check fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eterna-reviewed-256-build
          path: review-build-evidence
          retention-days: 30
          if-no-files-found: warn
