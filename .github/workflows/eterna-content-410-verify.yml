name: Eterna consolidated content 410 build and private proof
on:
  push:
    branches: ["feat/eterna-content-410-consolidated-20260912"]
    paths: ["qa/content-410/**", "eterna-worker/test/content-410.test.mjs", ".github/workflows/eterna-content-410-verify.yml"]
permissions:
  contents: write
  actions: read
concurrency:
  group: eterna-content-410-verify
  cancel-in-progress: false
jobs:
  build-and-private:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_INPUT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 81bf9e7a46c67bb12638a941a1cd774ad3de14bc
          path: .qa-auth
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: f1f701f03ea39b9f052d145fcd169993245211f6
          path: .qa-combined
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with:
          name: eterna-content-370-build
          run-id: 34692999112
          github-token: ${{ github.token }}
          path: inputs
      - name: Compile only forty non-overlapping original topics against the actual published edition
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('qa/content-410/build.py');s=p.read_text()
          s=s.replace("s.replace(needle,needle[:-1]+'.slice(0,370))')","s.replace(needle,needle+'.slice(0,370)')")
          p.write_text(s)
          PY
          python qa/content-410/build.py
      - name: Full existing and new regression suite
        run: |
          cd eterna-worker
          npm run check > ../content-410-evidence/regression.txt 2>&1
          tail -12 ../content-410-evidence/regression.txt
          grep -q '^# fail 0$' ../content-410-evidence/regression.txt
          npm ci --no-audit --no-fund
      - name: Commit only tested educational source and evidence, never main
        run: |
          test "$GITHUB_REF" = "refs/heads/feat/eterna-content-410-consolidated-20260912"
          python - <<'PY'
          import subprocess
          allowed={'eterna-worker/src/index.js','eterna-worker/src/library/content-v1.js','eterna-worker/src/library/runtime-v1.js','eterna-worker/test/library-first.test.mjs','eterna-worker/test/sprint-harness.mjs','eterna-worker/test/content-370.test.mjs','qa/library/lessons-v1.json','qa/content-410/build.py'}
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines());assert changed<=allowed,changed
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- eterna-worker/src/index.js eterna-worker/src/library/content-v1.js eterna-worker/src/library/runtime-v1.js eterna-worker/test/library-first.test.mjs eterna-worker/test/sprint-harness.mjs eterna-worker/test/content-370.test.mjs qa/library/lessons-v1.json qa/content-410/build.py qa/content-410/manifest.json qa/content-410/added-lessons.json qa/content-410/review-ledger.json
          git commit -m "content(eterna): verified 410-lesson consolidation with forty distinct additions" -m "Preserve the already published 370 fiches, 1110 questions, no-repeat generator and all unrelated runtime/voice behavior. Exclude twenty semantic duplicates from the parallel draft. No production change."
          git push origin HEAD:refs/heads/feat/eterna-content-410-consolidated-20260912
          node --input-type=module <<'JS'
          import{readFileSync,writeFileSync}from'node:fs';import{createHash}from'node:crypto';import{execFileSync}from'node:child_process';import assert from'node:assert/strict';
          const m=JSON.parse(readFileSync('qa/content-410/manifest.json')),log=readFileSync('content-410-evidence/regression.txt','utf8');
          const pass=Number(log.match(/^# pass (\d+)$/m)[1]),fail=Number(log.match(/^# fail (\d+)$/m)[1]);assert.equal(fail,0);assert.ok(pass>906);
          const paths=['eterna-worker/src/index.js','eterna-worker/src/library/content-v1.js','eterna-worker/src/library/runtime-v1.js','eterna-worker/src/library/procedural-v1.js','eterna-worker/src/library/compass-data-v1.js','eterna-worker/src/library/curricular-compass-v1.js','eterna-worker/test/library-first.test.mjs','eterna-worker/test/sprint-harness.mjs','eterna-worker/test/content-370.test.mjs','eterna-worker/test/content-410.test.mjs','qa/library/lessons-v1.json','qa/content-410/manifest.json','qa/content-410/added-lessons.json','qa/content-410/review-ledger.json'];
          const blobs=Object.fromEntries(paths.map(p=>[p,{sha:execFileSync('git',['hash-object',p],{encoding:'utf8'}).trim(),sha256:createHash('sha256').update(readFileSync(p)).digest('hex')}]));
          writeFileSync('content-410-evidence/report.json',JSON.stringify({...m,tested_commit:execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),tests_passed:pass,tests_failed:fail,production_changed:false,blobs},null,2));
          JS
          git archive HEAD eterna-worker/src eterna-worker/test eterna-worker/package.json eterna-worker/package-lock.json eterna-state-contract-v3.js eterna-v159.js eterna-experience-v160.js qa > content-410-evidence/tested-source.tar
      - name: Prepare scoped disposable identities, exact draft import and canonical candidate
        run: |
          python qa/content-410/prepare_private.py
          node --check qa/content-410/remote_private.generated.mjs
      - name: First twenty new lessons and answers, then remove identity
        env: {ETERNA_QA_GROUP: '1'}
        run: node qa/content-410/remote_private.generated.mjs
      - name: Remaining twenty new lessons and answers, then remove identity
        env: {ETERNA_QA_GROUP: '2'}
        run: node qa/content-410/remote_private.generated.mjs
      - name: Require every lesson, zero-generation route and both cleanups
        run: node qa/content-410/combine_private.mjs
      - name: Preserve actual build and private evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eterna-content-410-proof
          path: |
            content-410-evidence
            content-410-private
          retention-days: 90
          if-no-files-found: warn
