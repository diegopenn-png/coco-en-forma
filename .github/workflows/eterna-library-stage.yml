name: Eterna private library staging and compiled verification
on:
  push:
    branches: ["feat/eterna-library-first-202609"]
    paths: ["qa/library/stage_library.mjs", ".github/workflows/eterna-library-stage.yml"]
permissions:
  contents: read
  actions: read
concurrency:
  group: eterna-library-stage
  cancel-in-progress: false
jobs:
  stage-public-content-only:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_INPUT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: eterna-official-curriculum-corrected
          run-id: 34657365098
          github-token: ${{ github.token }}
          path: .official-library
      - name: Validate canonical syntax and existing regression
        run: |
          node --check qa/library/stage_library.mjs
          mkdir -p library-stage-evidence
          cd eterna-worker
          npm run check > ../library-stage-evidence/regression.txt
          tail -10 ../library-stage-evidence/regression.txt
          npm ci --no-audit --no-fund
      - name: Verify generated importer before upload
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('qa/library/stage_library.mjs');s=p.read_text()
          before=r"env.SUPABASE_URL.replace(/\/$/,'')"
          assert s.count(before)==1
          s=s.replace(before,'new URL(env.SUPABASE_URL).origin')
          before="writeFileSync('eterna-worker/src/.library-stage.js',generated);"
          assert s.count(before)==1
          s=s.replace(before,before+"\nexecFileSync(process.execPath,['--check','eterna-worker/src/.library-stage.js'],{stdio:'pipe'});")
          p.write_text(s)
          PY
      - name: Import fixed public content via expiring private version, never deploy
        run: node qa/library/stage_library.mjs
      - name: Preserve sanitized import and runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eterna-library-stage-verification
          path: library-stage-evidence
          retention-days: 90
          if-no-files-found: warn
