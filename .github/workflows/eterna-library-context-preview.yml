name: Eterna PWA context canonical preview
on:
  push:
    branches: ["fix/eterna-library-pwa-context-20260912"]
    paths: ["qa/library/context_edge_fixture.js", "qa/library/preview_context.mjs", ".github/workflows/eterna-library-context-preview.yml"]
permissions:
  contents: read
  actions: read
jobs:
  canonical-preview-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_INPUT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: a877d730a018fce369b5b262310cd8182439a7bc
          path: .published-baseline
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: eterna-library-pwa-context-verification
          run-id: 34661643283
          github-token: ${{ github.token }}
          path: .context-proof
      - name: Repeat all regressions and install locked tooling
        run: |
          mkdir -p library-context-edge-evidence
          cd eterna-worker
          npm run check > ../library-context-edge-evidence/regression.txt
          tail -10 ../library-context-edge-evidence/regression.txt
          npm ci --no-audit --no-fund
      - name: Verify immutable source, original bindings, context and real-model fallback privately
        run: node qa/library/preview_context.mjs
      - name: Preserve sanitized compiled verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eterna-library-context-edge-verification
          path: library-context-edge-evidence
          retention-days: 30
          if-no-files-found: warn
