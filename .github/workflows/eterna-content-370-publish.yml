name: Publish verified 60 new Eterna lessons
on:
  push:
    branches: ["ops/eterna-content-370-publish-20260912"]
    paths: [".github/workflows/eterna-content-370-publish.yml", "qa/content-370-publish/promote.mjs"]
permissions:
  contents: read
  actions: read
concurrency:
  group: eterna-worker-production
  cancel-in-progress: false
jobs:
  guarded-content-promotion:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_INPUT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/download-artifact@v4
        with:
          name: eterna-content-370-build
          run-id: 34691808502
          github-token: ${{ github.token }}
          path: .build-proof
      - uses: actions/download-artifact@v4
        with:
          name: eterna-content-370-private
          run-id: 34691981485
          github-token: ${{ github.token }}
          path: .private-proof
      - name: Repeat full regression on exactly the selected production source
        run: |
          mkdir -p content-370-production-evidence
          node --check qa/content-370-publish/promote.mjs
          cd eterna-worker
          npm run check > ../content-370-production-evidence/regression.txt 2>&1
          tail -10 ../content-370-production-evidence/regression.txt
          grep -q '^# pass 906$' ../content-370-production-evidence/regression.txt
          grep -q '^# fail 0$' ../content-370-production-evidence/regression.txt
          npm ci --no-audit --no-fund
      - name: Promote the exact privately verified canonical version, preserving voice and existing settings
        run: node qa/content-370-publish/promote.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eterna-content-370-production
          path: content-370-production-evidence
          retention-days: 90
          if-no-files-found: warn
