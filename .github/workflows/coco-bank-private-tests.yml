name: Coco Bank private checks
on:
  push:
    paths:
      - '.github/coco-bank/**'
      - 'coco-bank-private-v1.js'
      - '.github/workflows/coco-bank-private-tests.yml'
  pull_request:
    paths:
      - '.github/coco-bank/**'
      - 'coco-bank-private-v1.js'
jobs:
  financial-and-access-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test .github/coco-bank/test/engine.test.mjs
      - run: node --check coco-bank-private-v1.js
