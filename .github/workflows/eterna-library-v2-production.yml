name: Publish verified Eterna 160-lesson snapshot
on:
  push:
    branches: ["ops/eterna-library-160-publish-6b83b04"]
    paths: [".github/workflows/eterna-library-v2-production.yml"]
permissions:
  contents: read
  actions: read
concurrency:
  group: eterna-worker-production
  cancel-in-progress: false
jobs:
  immutable-verified-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_INPUT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
      EXPECTED_MAIN: 6b83b043e85d0eb15e629affb0f42d2957a6cc83
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Recheck source regression before any deployment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p library-publication-evidence
          cd eterna-worker
          npm run check > ../library-publication-evidence/regression.txt 2>&1
          tail -10 ../library-publication-evidence/regression.txt
          grep -q '^# pass 485$' ../library-publication-evidence/regression.txt
          grep -q '^# fail 0$' ../library-publication-evidence/regression.txt
          npm ci --no-audit --no-fund
      - name: Get exact unchanged live context source for compiled comparison
        run: git fetch --depth=1 origin e40e3bbbd7d6ae464a9e17659cd8ae3d36245852
      - uses: actions/download-artifact@v4
        with:
          name: eterna-library-160-isolated-proof
          run-id: 34664212467
          github-token: ${{ github.token }}
          path: .canonical-proof
      - name: Compare live baseline and deploy only exact private-tested immutable version
        run: node qa/library/publish_v2_verified.mjs
      - name: Preserve sanitized final publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eterna-library-160-production-proof
          path: library-publication-evidence
          retention-days: 90
          if-no-files-found: warn
