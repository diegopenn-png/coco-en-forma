name: Publish exact verified Eterna simulated-panel content
on:
  push:
    branches: ["ops/eterna-panel-publish-12c672a"]
    paths: ["qa/teacher-panel/publish.mjs", ".github/workflows/eterna-panel-publish.yml"]
permissions:
  contents: read
  actions: read
concurrency:
  group: eterna-worker-production
  cancel-in-progress: false
jobs:
  immutable-promotion:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_INPUT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: eterna-panel-304-private
          run-id: 34669693567
          github-token: ${{ github.token }}
          path: .private-proof
      - uses: actions/download-artifact@v4
        with:
          name: eterna-panel-304-build
          run-id: 34669394225
          github-token: ${{ github.token }}
          path: .build-proof
      - name: Recheck exact source and all regression tests
        run: |
          mkdir -p panel-production-evidence
          node --check qa/teacher-panel/publish.mjs
          cd eterna-worker
          npm run check > ../panel-production-evidence/regression.txt 2>&1
          tail -10 ../panel-production-evidence/regression.txt
          grep -q '^# pass 674$' ../panel-production-evidence/regression.txt
          grep -q '^# fail 0$' ../panel-production-evidence/regression.txt
          npm ci --no-audit --no-fund
      - name: Verify main, immutable proof and settings, then promote only the tested canonical version
        run: node qa/teacher-panel/publish.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eterna-panel-304-production
          path: panel-production-evidence
          retention-days: 90
          if-no-files-found: warn
