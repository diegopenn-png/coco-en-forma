name: Validate Eterna conversation director

on:
  pull_request:
    paths:
      - 'eterna-worker/**'
      - 'qa/eterna/conversation-director-v1.test.mjs'
      - '.github/workflows/validate-eterna-conversation-director.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check Worker
        run: node --check eterna-worker/src/index.js
      - name: Conversation director regression checks
        run: node qa/eterna/conversation-director-v1.test.mjs
      - name: Existing Eterna tests
        run: |
          cd eterna-worker
          npm install --ignore-scripts
          npm test --if-present
