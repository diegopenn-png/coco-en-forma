name: Deploy Eterna Worker 160.96.8

on:
  push:
    branches:
      - main
    paths:
      - ".github/release-eterna-160960"

permissions:
  contents: read

concurrency:
  group: eterna-worker-production
  cancel-in-progress: false

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_INPUT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EXPECTED_VERSION: 160.96.8-moderation-resilience
      WORKER_NAME: coco-eterna-v159
      PRODUCTION_HEALTH_URL: https://coco-eterna-v159.chatinmobiliario.workers.dev/health

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: eterna-worker/package-lock.json

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "CLOUDFLARE_API_TOKEN is not configured" >&2
            exit 1
          fi
          if [[ -z "${CLOUDFLARE_ACCOUNT_INPUT:-}" ]]; then
            echo "CLOUDFLARE_ACCOUNT_ID is not configured" >&2
            exit 1
          fi

          clean_token="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          if [[ -z "$clean_token" ]]; then
            echo "CLOUDFLARE_API_TOKEN contains no usable token value" >&2
            exit 1
          fi
          echo "::add-mask::$clean_token"
          echo "CLOUDFLARE_API_TOKEN=${clean_token}" >> "$GITHUB_ENV"

          account_id="${CLOUDFLARE_ACCOUNT_INPUT#https://dash.cloudflare.com/}"
          account_id="${account_id%%/*}"
          if [[ ! "$account_id" =~ ^[0-9a-fA-F]{32}$ ]]; then
            echo "CLOUDFLARE_ACCOUNT_ID must contain a 32-character account ID or a Cloudflare dashboard URL" >&2
            exit 1
          fi
          echo "::add-mask::$account_id"
          echo "CLOUDFLARE_ACCOUNT_ID=${account_id}" >> "$GITHUB_ENV"

          probe_token="$(openssl rand -hex 32)"
          echo "::add-mask::$probe_token"
          echo "DEPLOY_PROBE_TOKEN=${probe_token}" >> "$GITHUB_ENV"

      - name: Install Worker tooling
        working-directory: eterna-worker
        run: npm ci --no-audit --no-fund

      - name: Run complete regression suite
        working-directory: eterna-worker
        run: npm run check

      - name: Upload isolated production candidate
        working-directory: eterna-worker
        shell: bash
        run: |
          npx wrangler versions upload \
            --name "$WORKER_NAME" \
            --keep-vars \
            --var "SCOPE_MODEL:gpt-5.6-luna" \
            --var "SCOPE_FALLBACK_MODEL:gpt-5.6-terra" \
            --var "SCOPE_REASONING_EFFORT:low" \
            --var "TUTOR_MODEL:gpt-5.6-sol" \
            --var "TUTOR_FALLBACK_MODEL:gpt-5.6-terra" \
            --var "TUTOR_COMPATIBILITY_MODEL:gpt-5.4-mini" \
            --var "TUTOR_REASONING_EFFORT:high" \
            --var "VERIFIER_MODEL:gpt-5.6-terra" \
            --var "VERIFIER_REASONING_EFFORT:high" \
            --var "VISION_MODEL:gpt-5.6-sol" \
            --var "VISION_REASONING_EFFORT:high" \
            --var "WEB_SEARCH_MODEL:gpt-5.6-terra" \
            --var "WEB_SEARCH_REASONING_EFFORT:low" \
            --var "DEPLOY_PROBE_TOKEN:${DEPLOY_PROBE_TOKEN}" | tee production-candidate.log

          version_id="$(sed -n -E 's/^(Worker )?Version ID: //p' production-candidate.log | tail -1)"
          preview_url="$(sed -n 's/^Version Preview URL: //p' production-candidate.log | tail -1)"
          if [[ ! "$version_id" =~ ^[0-9a-f-]{36}$ ]]; then
            echo "Could not determine the candidate version ID" >&2
            exit 1
          fi
          if [[ ! "$preview_url" =~ ^https://[0-9a-f-]+-coco-eterna-v159\.chatinmobiliario\.workers\.dev$ ]]; then
            echo "Could not determine the candidate preview URL" >&2
            exit 1
          fi
          echo "TARGET_VERSION_ID=${version_id}" >> "$GITHUB_ENV"
          echo "PREVIEW_HEALTH_URL=${preview_url}/health" >> "$GITHUB_ENV"
          echo "PREVIEW_DEPENDENCY_URL=${preview_url}/health/dependencies" >> "$GITHUB_ENV"

      - name: Verify isolated candidate and model configuration
        shell: bash
        run: |
          preview_payload="$(curl --fail --silent --show-error --max-time 20 "$PREVIEW_HEALTH_URL")"
          node -e '
            const payload = JSON.parse(process.argv[1]);
            const models = payload.model_configuration || {};
            const valid = payload.ok === true
              && payload.version === process.env.EXPECTED_VERSION
              && payload.openai_configured === true
              && payload.supabase_configured === true
              && models.scope?.model === "gpt-5.6-luna"
              && models.scope?.fallback_model === "gpt-5.6-terra"
              && models.scope?.reasoning_effort === "low"
              && models.tutor?.model === "gpt-5.6-sol"
              && models.tutor?.fallback_model === "gpt-5.6-terra"
              && models.tutor?.compatibility_model === "gpt-5.4-mini"
              && models.tutor?.reasoning_effort === "high"
              && models.verifier?.model === "gpt-5.6-terra"
              && models.verifier?.reasoning_effort === "high"
              && models.vision?.model === "gpt-5.6-sol"
              && models.vision?.reasoning_effort === "high"
              && models.web_search?.model === "gpt-5.6-terra"
              && models.web_search?.reasoning_effort === "low"
              && payload.features?.full_intelligence_child_safety_v1 === true
              && payload.features?.suspended_topic_resume_v1 === true
              && payload.features?.deterministic_arithmetic_guidance_v1 === true
              && payload.features?.deterministic_pending_numeric_v1 === true
              && payload.features?.adaptive_sync_verification_v1 === true
              && payload.features?.asynchronous_verifier_audit_v1 === true
              && payload.features?.deterministic_exam_intake_v1 === true
              && payload.features?.exam_tutor_recovery_v1 === true
              && payload.features?.structured_request_retry_v1 === true
              && payload.features?.structured_compatibility_retry_v1 === true
              && payload.features?.tutor_model_failover_v1 === true
              && payload.features?.tutor_compatibility_model_v1 === true
              && payload.features?.stable_fact_tutor_recovery_v1 === true
              && payload.features?.scope_model_failover_v1 === true
              && payload.features?.moderation_request_retry_v1 === true
              && payload.features?.moderation_diagnostics_v1 === true
              && payload.features?.degraded_safe_academic_moderation_v1 === true;
            if (!valid) {
              console.error("Unexpected production candidate health payload", payload);
              process.exit(1);
            }
          ' "$preview_payload"

          dependency_payload="$(curl --silent --show-error --max-time 45 -H "Authorization: Bearer ${DEPLOY_PROBE_TOKEN}" "$PREVIEW_DEPENDENCY_URL" || true)"
          echo "Sanitized OpenAI dependency probe: ${dependency_payload}"
          node -e '
            const payload = JSON.parse(process.argv[1]);
            if (payload.version !== process.env.EXPECTED_VERSION) process.exit(1);
            for (const name of ["moderation", "responses"]) {
              const item = payload[name] || {};
              if (item.ok !== true && !/^((MODERATION|RESPONSES)_(HTTP|NETWORK|UNKNOWN))/.test(String(item.diagnostic_code || ""))) process.exit(1);
            }
          ' "$dependency_payload"

      - name: Deploy the verified candidate to production
        working-directory: eterna-worker
        shell: bash
        run: |
          npx wrangler versions deploy \
            "${TARGET_VERSION_ID}@100%" \
            --name "$WORKER_NAME" \
            --message "Eterna 160.96.8 moderation resilience" \
            --yes

      - name: Verify production or roll back automatically
        working-directory: eterna-worker
        shell: bash
        run: |
          healthy=false
          for attempt in 1 2 3 4 5 6; do
            payload="$(curl --silent --show-error --max-time 20 "$PRODUCTION_HEALTH_URL" || true)"
            if node -e '
              try {
                const payload = JSON.parse(process.argv[1]);
                const models = payload.model_configuration || {};
                const valid = payload.ok === true
                  && payload.version === process.env.EXPECTED_VERSION
                  && models.scope?.model === "gpt-5.6-luna"
                  && models.scope?.fallback_model === "gpt-5.6-terra"
                  && models.scope?.reasoning_effort === "low"
                  && models.tutor?.model === "gpt-5.6-sol"
                  && models.tutor?.fallback_model === "gpt-5.6-terra"
                  && models.tutor?.compatibility_model === "gpt-5.4-mini"
                  && models.tutor?.reasoning_effort === "high"
                  && models.verifier?.model === "gpt-5.6-terra"
                  && models.verifier?.reasoning_effort === "high"
                  && payload.features?.full_intelligence_child_safety_v1 === true
                  && payload.features?.suspended_topic_resume_v1 === true
                  && payload.features?.deterministic_arithmetic_guidance_v1 === true
                  && payload.features?.deterministic_pending_numeric_v1 === true
                  && payload.features?.adaptive_sync_verification_v1 === true
                  && payload.features?.asynchronous_verifier_audit_v1 === true
                  && payload.features?.deterministic_exam_intake_v1 === true
                  && payload.features?.exam_tutor_recovery_v1 === true
                  && payload.features?.structured_request_retry_v1 === true
                  && payload.features?.structured_compatibility_retry_v1 === true
                  && payload.features?.tutor_model_failover_v1 === true
                  && payload.features?.tutor_compatibility_model_v1 === true
                  && payload.features?.stable_fact_tutor_recovery_v1 === true
                  && payload.features?.scope_model_failover_v1 === true
                  && payload.features?.moderation_request_retry_v1 === true
                  && payload.features?.moderation_diagnostics_v1 === true
                  && payload.features?.degraded_safe_academic_moderation_v1 === true;
                process.exit(valid ? 0 : 1);
              } catch {
                process.exit(1);
              }
            ' "$payload"; then
              healthy=true
              break
            fi
            sleep 5
          done

          if [[ "$healthy" != "true" ]]; then
            echo "Production health verification failed; rolling back." >&2
            npx wrangler rollback \
              --name "$WORKER_NAME" \
              --message "Automatic rollback after failed Eterna 160.96.8 health check" \
              --yes
            exit 1
          fi

          echo "Production is healthy on ${EXPECTED_VERSION} with the verified model configuration."
