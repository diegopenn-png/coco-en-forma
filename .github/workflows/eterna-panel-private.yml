name: Eterna simulated-panel canonical private proof
on:
  push:
    branches: ["feat/eterna-panel-multidisciplinar-20260912"]
    paths: ["qa/teacher-panel/prepare_private.py", ".github/workflows/eterna-panel-private.yml"]
permissions:
  contents: read
  actions: read
concurrency:
  group: eterna-panel-private
  cancel-in-progress: false
jobs:
  canonical-private-and-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_INPUT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 81bf9e7a46c67bb12638a941a1cd774ad3de14bc
          path: .qa-auth
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: f1f701f03ea39b9f052d145fcd169993245211f6
          path: .qa-combined
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: eterna-panel-304-build
          run-id: 34669394225
          github-token: ${{ github.token }}
          path: panel-build-evidence
      - name: Repeat 674 regressions and use locked Worker tooling
        run: |
          mkdir -p panel-private-evidence
          cd eterna-worker
          npm run check > ../panel-private-evidence/regression.txt 2>&1
          tail -10 ../panel-private-evidence/regression.txt
          grep -q '^# pass 674$' ../panel-private-evidence/regression.txt
          grep -q '^# fail 0$' ../panel-private-evidence/regression.txt
          npm ci --no-audit --no-fund
      - name: Prepare checked expiring public-content and synthetic-account helper
        run: |
          python qa/teacher-panel/prepare_private.py
          node --check qa/teacher-panel/remote_panel.generated.mjs
      - name: Verify canonical private Worker with actual auth and Supabase; remove synthetic identity
        run: node qa/teacher-panel/remote_panel.generated.mjs
      - name: Require exact content, zero generation and completed cleanup
        run: |
          node --input-type=module <<'JS'
          import{readFileSync}from'node:fs';import assert from'node:assert/strict';
          const r=JSON.parse(readFileSync('panel-private-evidence/report.json'));
          assert.equal(r.phase,'canonical-private-verified');assert.equal(r.requests.length,96);
          assert.equal(r.synthetic_cleanup.ok,true);assert.equal(r.synthetic_cleanup.deleted,true);
          assert.equal(r.draft_content.lessons,304);assert.equal(r.draft_content.protocols,56);assert.equal(r.draft_content.hash_mismatches,0);
          for(const p of r.requests){assert.equal(p.generation_model_calls,0);assert.equal(p.generation_tokens,0)}
          console.log('PASS: 96 real authenticated prepared responses, exact 304-lesson snapshot stored, zero generated tokens, synthetic identity removed. No production deployment.');
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eterna-panel-304-private
          path: panel-private-evidence
          retention-days: 30
          if-no-files-found: warn
