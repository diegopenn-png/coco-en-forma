name: Eterna authenticated preview

on:
  push:
    branches:
      - "fix/eterna-six-modes-state-machine"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: eterna-authenticated-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_INPUT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PREVIEW_ORIGIN: https://coco-eterna-six-modes-preview.chatinmobiliario.workers.dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: eterna-worker/package-lock.json

      - name: Validate Cloudflare secrets
        shell: bash
        run: |
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "CLOUDFLARE_API_TOKEN is not configured" >&2
            exit 1
          fi
          if [[ -z "${CLOUDFLARE_ACCOUNT_INPUT:-}" ]]; then
            echo "CLOUDFLARE_ACCOUNT_ID is not configured" >&2
            exit 1
          fi

          clean_token="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          if [[ -z "$clean_token" ]]; then
            echo "CLOUDFLARE_API_TOKEN contains no usable token value" >&2
            exit 1
          fi
          echo "::add-mask::$clean_token"
          echo "CLOUDFLARE_API_TOKEN=${clean_token}" >> "$GITHUB_ENV"

          account_id="${CLOUDFLARE_ACCOUNT_INPUT#https://dash.cloudflare.com/}"
          account_id="${account_id%%/*}"
          if [[ ! "$account_id" =~ ^[0-9a-fA-F]{32}$ ]]; then
            echo "CLOUDFLARE_ACCOUNT_ID must contain a 32-character account ID or a Cloudflare dashboard URL" >&2
            exit 1
          fi
          echo "::add-mask::$account_id"
          echo "CLOUDFLARE_ACCOUNT_ID=${account_id}" >> "$GITHUB_ENV"

      - name: Install Worker tooling
        working-directory: eterna-worker
        run: npm ci --no-audit --no-fund

      - name: Run Worker regression
        working-directory: eterna-worker
        run: npm run check

      - name: Upload isolated API preview
        working-directory: eterna-worker
        shell: bash
        run: |
          allowed_origins="https://www.cocoenforma.com,https://cocoenforma.com,${PREVIEW_ORIGIN},http://terminal.local:4173"
          npx wrangler versions upload \
            --name coco-eterna-v159 \
            --keep-vars \
            --var "ALLOWED_ORIGINS:${allowed_origins}" | tee authenticated-preview-api.log

          api_preview_url="$(sed -n 's/^Version Preview URL: //p' authenticated-preview-api.log | tail -1)"
          if [[ ! "$api_preview_url" =~ ^https://[0-9a-f-]+-coco-eterna-v159\.chatinmobiliario\.workers\.dev$ ]]; then
            echo "Could not determine the isolated API preview URL" >&2
            exit 1
          fi
          echo "API_PREVIEW_URL=${api_preview_url}" >> "$GITHUB_ENV"

      - name: Build isolated frontend assets
        shell: bash
        run: |
          mkdir -p preview-dist
          while IFS= read -r -d '' file; do
            case "$file" in
              .github/*|eterna-worker/*|tools/*|*.md|*.txt|*.sql|eterna-auth-preview-wrangler.jsonc|qa-preview-headers.txt)
                continue
                ;;
            esac
            mkdir -p "preview-dist/$(dirname "$file")"
            cp -- "$file" "preview-dist/$file"
          done < <(git ls-files -z)

          cp qa-preview-headers.txt preview-dist/_headers
          sed -i \
            "s#https://coco-eterna-v159.chatinmobiliario.workers.dev#${API_PREVIEW_URL}#g" \
            preview-dist/index.html

          # The QA origin must always serve the current PR head. Disable the
          # production PWA cache in the isolated preview and replace any
          # previously installed preview worker with a one-shot cleanup worker.
          sed -i \
            's#<head>#<head><script>window.__cocoPwaV135Registered=true;window.__cocoPwaV16043Booted=true;</script>#' \
            preview-dist/index.html
          cp qa/eterna/preview-no-cache-sw.js preview-dist/sw.js

          grep -F "${API_PREVIEW_URL}" preview-dist/index.html >/dev/null
          grep -F '160.93.7-family-plans-unlimited' preview-dist/eterna-v159.js >/dev/null
          grep -F '160.93.7-family-plans-unlimited' eterna-worker/src/index.js >/dev/null
          grep -F 'window.__cocoPwaV135Registered=true' preview-dist/index.html >/dev/null
          grep -F 'self.registration.unregister()' preview-dist/sw.js >/dev/null

      - name: Validate frontend preview deployment
        shell: bash
        run: |
          ./eterna-worker/node_modules/.bin/wrangler deploy \
            --config eterna-auth-preview-wrangler.jsonc \
            --dry-run \
            --outdir /tmp/eterna-auth-preview-dry-run

      - name: Deploy isolated frontend subdomain
        shell: bash
        run: |
          ./eterna-worker/node_modules/.bin/wrangler deploy \
            --config eterna-auth-preview-wrangler.jsonc | tee authenticated-preview-frontend.log

      - name: Verify HTTPS, version and API health
        shell: bash
        run: |
          ready=0
          for attempt in {1..12}; do
            verify_url="${PREVIEW_ORIGIN}/eterna-v159.js?v=160937&verify=${GITHUB_SHA}-${attempt}"
            if curl --max-time 20 -fsS -H 'Cache-Control: no-cache' "$verify_url" -o /tmp/eterna-preview.js \
              && grep -F '160.93.7-family-plans-unlimited' /tmp/eterna-preview.js >/dev/null; then
              ready=1
              break
            fi
            sleep 10
          done
          if [[ "$ready" -ne 1 ]]; then
            echo "The isolated preview subdomain did not become ready" >&2
            exit 1
          fi

          curl --max-time 20 -fsS -H 'Cache-Control: no-cache' \
            "${PREVIEW_ORIGIN}/coco-excellence-v160934.js?v=1609343&verify=${GITHUB_SHA}" \
            | grep -F '160.93.4-excellence-pass' >/dev/null
          core_ready=0
          for attempt in {1..6}; do
            core_url="${PREVIEW_ORIGIN}/coco-v144-core.js?v=15001&verify=${GITHUB_SHA}-${attempt}"
            if curl --max-time 20 -fsS -H 'Cache-Control: no-cache' "$core_url" -o /tmp/coco-preview-core.js \
              && grep -F 'Inicia sesión para abrir ' /tmp/coco-preview-core.js >/dev/null; then
              core_ready=1
              break
            fi
            sleep 5
          done
          if [[ "$core_ready" -ne 1 ]]; then
            echo "The public game login gate did not become ready" >&2
            exit 1
          fi
          curl --max-time 20 -fsS "${API_PREVIEW_URL}/health" | tee authenticated-preview-health.json
          grep -F '160.93.7-family-plans-unlimited' authenticated-preview-health.json >/dev/null
          curl --max-time 20 -fsS -D authenticated-preview-headers.log -o /dev/null "${PREVIEW_ORIGIN}/"
          grep -Fi 'x-robots-tag: noindex' authenticated-preview-headers.log >/dev/null

          {
            echo "## Eterna authenticated preview"
            echo "- Frontend: ${PREVIEW_ORIGIN}"
            echo "- API: ${API_PREVIEW_URL}"
            echo "- Expected versions: frontend 160.93.7-family-plans-unlimited · API 160.93.7-family-plans-unlimited"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve preview evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eterna-authenticated-preview-${{ github.sha }}
          path: |
            eterna-worker/authenticated-preview-api.log
            authenticated-preview-frontend.log
            authenticated-preview-health.json
            authenticated-preview-headers.log
          if-no-files-found: warn
          retention-days: 7
