name: Eterna isolated 160-lesson verified release
on:
  push:
    branches: ["release/eterna-library-160-3069e276"]
    paths: [".github/workflows/eterna-library-160-isolated.yml"]
permissions:
  contents: write
  actions: read
concurrency:
  group: eterna-library-private-qa
  cancel-in-progress: false
jobs:
  isolated-verified-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_INPUT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify published context baseline has not changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api repos/diegopenn-png/coco-en-forma/git/ref/heads/main --jq '.object.sha')" = e40e3bbbd7d6ae464a9e17659cd8ae3d36245852
      - name: Give the tested snapshot its own release namespace
        run: python qa/library/isolate_verified_160.py source
      - name: Repeat all 485 regressions against the exact namespaced source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p library-v2-evidence
          cd eterna-worker
          npm run check > ../library-v2-evidence/regression.txt 2>&1
          tail -10 ../library-v2-evidence/regression.txt
          grep -q '^# pass 485$' ../library-v2-evidence/regression.txt
          grep -q '^# fail 0$' ../library-v2-evidence/regression.txt
          npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: eterna-library-v2-official-source-archive
          run-id: 34663145165
          github-token: ${{ github.token }}
          path: library-v2-source-evidence
      - name: Prepare only scoped canonical QA and namespaced staging
        run: |
          git fetch --depth=1 origin 81bf9e7a46c67bb12638a941a1cd774ad3de14bc
          git show 81bf9e7a46c67bb12638a941a1cd774ad3de14bc:qa/library/remote_canonical_verify.mjs > .v2-previous-qa.mjs
          python qa/library/prepare_remote_v2.py
          python qa/library/partition_synthetic_v2.py
          python qa/library/isolate_verified_160.py driver
          node --check qa/library/remote_v2.generated.mjs
      - name: Repeat real 120-turn verification, import exact snapshot and clean up fixtures
        run: node qa/library/remote_v2.generated.mjs
      - name: Commit namespaced sources only after all checks and cleanup pass
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,subprocess
          r=json.loads(Path('library-v2-evidence/report.json').read_text())
          assert r['phase']=='canonical-private-verified' and r['release']=='eterna-library-2026.09-v2-160-3069e276'
          assert r['synthetic_cleanup']['deleted'] and all(b['cleanup_verified'] for b in r['completed_synthetic_batches'])
          assert len(r['requests'])==120 and r['import_verification']['lesson_payloads_exact'] and r['import_verification']['protocol_payloads_exact']
          assert r['shared_v2_draft_untouched'] and r['import_verification']['documents']==0
          allowed={'eterna-worker/src/index.js','eterna-worker/src/library/content-v1.js','eterna-worker/src/library/runtime-v1.js','eterna-worker/test/library-first.test.mjs'}
          assert set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())==allowed
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- eterna-worker/src/index.js eterna-worker/src/library/content-v1.js eterna-worker/src/library/runtime-v1.js eterna-worker/test/library-first.test.mjs
          git commit -m "feat(eterna): isolate exact verified 160-lesson snapshot" -m "485 regressions and 120 real zero-generation turns repeated after namespacing. Shared v2 draft and extra concurrent content untouched. Exact DB payloads, original 80 lessons, context fixes, quotas, mic and frontend preserved."
          git push origin HEAD:refs/heads/release/eterna-library-160-3069e276
          node --input-type=module <<'JS'
          import{readFileSync,writeFileSync}from'node:fs';import{createHash}from'node:crypto';import{execFileSync}from'node:child_process';
          const path='library-v2-evidence/report.json',r=JSON.parse(readFileSync(path));r.source_commit=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const files=['eterna-worker/src/index.js','eterna-worker/src/library/content-v1.js','eterna-worker/src/library/runtime-v1.js','eterna-worker/test/library-first.test.mjs','qa/library/lessons-v1.json','qa/library/expansion-v2.json'];
          r.blobs=Object.fromEntries(files.map(p=>[p,{sha:execFileSync('git',['hash-object',p],{encoding:'utf8'}).trim(),sha256:createHash('sha256').update(readFileSync(p)).digest('hex')}]));r.source_archive=JSON.parse(readFileSync('library-v2-source-evidence/report.json'));r.context_fix_preserved=true;writeFileSync(path,JSON.stringify(r,null,2));
          JS
      - name: Preserve proof, no credentials or private generated helpers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eterna-library-160-isolated-proof
          path: library-v2-evidence
          retention-days: 30
          if-no-files-found: warn
