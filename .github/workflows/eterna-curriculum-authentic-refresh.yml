name: Eterna authentic curriculum refresh
on:
  push:
    branches: ["feat/eterna-curriculum-traceability-20260912"]
    paths: ["qa/curriculum-map/recover_authentic.mjs", ".github/workflows/eterna-curriculum-authentic-refresh.yml"]
permissions:
  contents: read
jobs:
  public-sources-only:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated public-document tools
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
      - name: Retrieve authentic source bytes and version metadata
        run: node qa/curriculum-map/recover_authentic.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eterna-curriculum-authentic-refresh
          path: curriculum-map-evidence
          retention-days: 90
          if-no-files-found: warn
