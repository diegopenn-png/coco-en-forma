name: Deploy Eterna stable audio recovery

on:
  push:
    branches:
      - main
    paths:
      - ".github/release-eterna-stable-audio"
      - ".github/workflows/eterna-worker-production-stable-audio.yml"

permissions:
  contents: read

concurrency:
  group: eterna-worker-production
  cancel-in-progress: false

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_INPUT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: coco-eterna-v159
      PRODUCTION_HEALTH_URL: https://coco-eterna-v159.chatinmobiliario.workers.dev/health

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: eterna-worker/package-lock.json

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_INPUT:-}"
          clean_token="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          account_id="${CLOUDFLARE_ACCOUNT_INPUT#https://dash.cloudflare.com/}"
          account_id="${account_id%%/*}"
          test -n "$clean_token"
          [[ "$account_id" =~ ^[0-9a-fA-F]{32}$ ]]
          echo "::add-mask::$clean_token"
          echo "::add-mask::$account_id"
          echo "CLOUDFLARE_API_TOKEN=${clean_token}" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=${account_id}" >> "$GITHUB_ENV"

      - name: Install Worker tooling
        working-directory: eterna-worker
        run: npm ci --no-audit --no-fund

      - name: Run complete regression suite
        working-directory: eterna-worker
        run: npm run check

      - name: Upload stable OpenAI provider candidate
        working-directory: eterna-worker
        shell: bash
        run: |
          npx wrangler versions upload \
            --name "$WORKER_NAME" \
            --keep-vars \
            --var "AI_PROVIDER:openai" \
            --var "ENABLE_OPENAI_FALLBACK:false" \
            --var "SCOPE_MODEL:gpt-5.6-luna" \
            --var "SCOPE_FALLBACK_MODEL:gpt-5.6-terra" \
            --var "SCOPE_REASONING_EFFORT:low" \
            --var "TUTOR_MODEL:gpt-5.6-sol" \
            --var "TUTOR_FALLBACK_MODEL:gpt-5.6-terra" \
            --var "TUTOR_COMPATIBILITY_MODEL:gpt-5.4-mini" \
            --var "TUTOR_REASONING_EFFORT:high" \
            --var "VERIFIER_MODEL:gpt-5.6-terra" \
            --var "VERIFIER_REASONING_EFFORT:high" \
            --var "VISION_MODEL:gpt-5.6-sol" \
            --var "VISION_REASONING_EFFORT:high" \
            --var "WEB_SEARCH_MODEL:gpt-5.6-terra" \
            --var "WEB_SEARCH_REASONING_EFFORT:low" \
            --var "TRANSCRIBE_MODEL:gpt-4o-mini-transcribe" \
            --var "TTS_MODEL:gpt-4o-mini-tts" | tee stable-audio-candidate.log

          version_id="$(sed -n -E 's/^(Worker )?Version ID: //p' stable-audio-candidate.log | tail -1)"
          preview_url="$(sed -n 's/^Version Preview URL: //p' stable-audio-candidate.log | tail -1)"
          [[ "$version_id" =~ ^[0-9a-f-]{36}$ ]]
          [[ "$preview_url" =~ ^https://[0-9a-f-]+-coco-eterna-v159\.chatinmobiliario\.workers\.dev$ ]]
          echo "TARGET_VERSION_ID=${version_id}" >> "$GITHUB_ENV"
          echo "PREVIEW_HEALTH_URL=${preview_url}/health" >> "$GITHUB_ENV"

      - name: Verify candidate
        shell: bash
        run: |
          payload="$(curl --fail --silent --show-error --max-time 20 "$PREVIEW_HEALTH_URL")"
          node -e '
            const p=JSON.parse(process.argv[1]);
            if(p.ok!==true || p.ai_provider!=="openai" || p.openai_configured!==true || p.supabase_configured!==true) process.exit(1);
            const m=p.model_configuration||{};
            if(m.speech?.transcribe_model!=="gpt-4o-mini-transcribe" || m.speech?.tts_model!=="gpt-4o-mini-tts") process.exit(1);
          ' "$payload"

      - name: Deploy verified candidate
        working-directory: eterna-worker
        run: |
          npx wrangler versions deploy \
            "${TARGET_VERSION_ID}@100%" \
            --name "$WORKER_NAME" \
            --message "Restore stable OpenAI transcription and speech path" \
            --yes

      - name: Verify production or roll back
        working-directory: eterna-worker
        shell: bash
        run: |
          healthy=false
          for attempt in 1 2 3 4 5 6; do
            payload="$(curl --silent --show-error --max-time 20 "$PRODUCTION_HEALTH_URL" || true)"
            if node -e '
              try {
                const p=JSON.parse(process.argv[1]);
                const m=p.model_configuration||{};
                process.exit(p.ok===true && p.ai_provider==="openai" && p.openai_configured===true && m.speech?.transcribe_model==="gpt-4o-mini-transcribe" && m.speech?.tts_model==="gpt-4o-mini-tts" ? 0 : 1);
              } catch { process.exit(1) }
            ' "$payload"; then healthy=true; break; fi
            sleep 5
          done
          if [[ "$healthy" != "true" ]]; then
            npx wrangler rollback --name "$WORKER_NAME" --message "Automatic rollback after stable audio recovery failure" --yes
            exit 1
          fi
