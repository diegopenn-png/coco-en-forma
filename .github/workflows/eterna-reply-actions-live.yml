name: Eterna removed reply buttons public and PWA verification
on:
  push:
    branches: ["qa/eterna-reply-buttons-live-59fef34"]
    paths: ["qa/reply-actions/sw_update_test.py", ".github/workflows/eterna-reply-actions-live.yml"]
permissions:
  contents: read
jobs:
  read-only-live-and-pwa:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Verify exact deployed bytes on both public hostnames independently of the cache fixture
        run: |
          node --input-type=module <<'JS'
          import{readFileSync,writeFileSync,mkdirSync}from'node:fs';import{createHash}from'node:crypto';import assert from'node:assert/strict';
          const hash=b=>createHash('sha256').update(b).digest('hex'),files=['index.html','eterna-v159.js','sw.js'],rows=[];
          for(const host of ['https://cocoenforma.com','https://www.cocoenforma.com'])for(const file of files){
            const expected=hash(readFileSync(file));let ok=false,last;
            for(let attempt=0;attempt<5;attempt++){
              try{const r=await fetch(host+'/'+file+'?__reply_actions=160994-r1',{headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(20000)});const raw=Buffer.from(await r.arrayBuffer());last={status:r.status,bytes:raw.length,sha256:hash(raw)};if(r.ok&&last.sha256===expected){rows.push({host,file,...last,exact_match:true});ok=true;break}}catch(e){last={error:String(e.message)}}
              await new Promise(r=>setTimeout(r,4000));
            }
            assert.ok(ok,'Public file mismatch '+host+'/'+file+' '+JSON.stringify(last));
          }
          const core=readFileSync('eterna-v159.js','utf8');for(const text of ['<button type="button" data-et-hint>','<button type="button" data-et-listen>','<button type="button" data-et-listen-slow'])assert.ok(!core.includes(text));
          assert.ok(readFileSync('sw.js','utf8').includes('coco-en-forma-v160.99.4-reply-actions-r1'));
          const result={production_commit:'59fef34f5595a235066c75f9b9c129cbbdaf57da',status:'public_files_verified',verified_at:new Date().toISOString(),removed_controls:['Pista','Escuchar','Más lento'],public_files:rows,production_changes_performed_by_verifier:false,worker_changed:false,microphone_changed:false,automatic_send_changed:false,physical_iphone_tested:false};
          mkdirSync('reply-actions-live-evidence',{recursive:true});writeFileSync('reply-actions-live-evidence/public.json',JSON.stringify(result,null,2));console.log(JSON.stringify(result));
          JS
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install isolated browser tooling
        run: |
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Verify effective PWA renderer after update and normal reload, recording any residual old cache
        run: python qa/reply-actions/sw_update_test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eterna-reply-buttons-live-proof
          path: reply-actions-live-evidence
          retention-days: 30
          if-no-files-found: warn
