name: Compute director Worker hashes

on:
  push:
    branches:
      - feat/eterna-conversation-director-160103

permissions:
  contents: write

jobs:
  hash:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply patch and compute transformed hashes
        run: |
          node tools/apply-conversation-director-160103.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const h=s=>crypto.createHash('sha256').update(s).digest('hex');
          const src=fs.readFileSync('eterna-worker/src/index.js','utf8');
          const m370=JSON.parse(fs.readFileSync('qa/content-370/manifest.json','utf8'));
          const m410=JSON.parse(fs.readFileSync('qa/content-410/manifest.json','utf8'));
          const text370=src.replaceAll('eterna-library-2026.09-v8-410-consolidated-1c484e','eterna-library-2026.09-v7-370-content-c26c61c').replaceAll(m370.release_id,m370.baseline_release);
          const text410=src.replaceAll(m410.release_id,m410.baseline_release);
          fs.writeFileSync('qa/eterna/director-worker-hashes.txt',`content370=${h(text370)}\ncontent410=${h(text410)}\n`);
          NODE
      - name: Commit hashes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa/eterna/director-worker-hashes.txt
          git commit -m 'ci: record conversation director Worker hashes' || exit 0
          git push origin HEAD:feat/eterna-conversation-director-160103
