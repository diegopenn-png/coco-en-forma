name: Publish exact verified Eterna exercise factory
on:
  push:
    branches: ["ops/eterna-sprint-publish-86ddb64"]
    paths: [".github/workflows/eterna-sprint-publish.yml", "qa/sprint/publish_verified.mjs"]
permissions:
  contents: read
  actions: read
concurrency:
  group: eterna-worker-production
  cancel-in-progress: false
jobs:
  guarded-canonical-promotion:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_INPUT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: eterna-sprint-private
          run-id: 34682659445
          github-token: ${{ github.token }}
          path: .private-proof
      - uses: actions/download-artifact@v4
        with:
          name: eterna-sprint-build
          run-id: 34682508300
          github-token: ${{ github.token }}
          path: .build-proof
      - name: Repeat full regression on exact production tree and locked deployment tooling
        run: |
          mkdir -p sprint-production-evidence
          node --check qa/sprint/publish_verified.mjs
          cd eterna-worker
          npm run check > ../sprint-production-evidence/regression.txt 2>&1
          tail -10 ../sprint-production-evidence/regression.txt
          grep -q '^# pass 753$' ../sprint-production-evidence/regression.txt
          grep -q '^# fail 0$' ../sprint-production-evidence/regression.txt
          npm ci --no-audit --no-fund
      - name: Verify main, exact private evidence and unchanged bindings before promoting tested version
        run: node qa/sprint/publish_verified.mjs
      - name: Preserve actual sanitized publication results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eterna-sprint-production
          path: sprint-production-evidence
          retention-days: 90
          if-no-files-found: warn
