name: Eterna general worksheet vision 160.99.15
on:
  push:
    branches: [fix/eterna-general-worksheet-vision-1609915]
permissions:
  contents: write
jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/eterna-general-worksheet-vision-1609915
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply general worksheet vision patch
        run: node qa/eterna/apply-general-worksheet-vision-1609915.mjs
      - name: Syntax
        run: node --check eterna-worker/src/index.js
      - name: Full Eterna regression
        run: node --test eterna-worker/test/*.test.mjs qa/*.test.mjs qa/eterna/*.test.mjs
      - name: Commit validated worker
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add eterna-worker/src/index.js
          git diff --cached --quiet && exit 0
          git commit -m "fix(eterna): generalize worksheet vision beyond arithmetic"
          git push origin HEAD:fix/eterna-general-worksheet-vision-1609915
