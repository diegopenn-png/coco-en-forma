name: Apply excellence 160.93.4 patch
on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
permissions:
  contents: write
jobs:
  apply:
    if: github.head_ref == 'feat/coco-eterna-excellence-160934'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/coco-eterna-excellence-160934
          fetch-depth: 4
      - name: Verify exact safe ancestry
        shell: bash
        run: |
          git merge-base --is-ancestor "5bf99b06d76d060bfe701bbc3ecf365bcd522d8b" HEAD
          test "$(git merge-base 5bf99b06d76d060bfe701bbc3ecf365bcd522d8b HEAD)" = "5bf99b06d76d060bfe701bbc3ecf365bcd522d8b"
      - name: Apply reviewed patch
        shell: bash
        run: |
          printf '%s' '' | base64 --decode > /tmp/excellence-160934.patch
          git apply --check /tmp/excellence-160934.patch
          git apply /tmp/excellence-160934.patch
          git rm .github/workflows/apply-excellence-160934.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "feat: polish Coco and Eterna UX before pilot"
          git push origin HEAD:feat/coco-eterna-excellence-160934
