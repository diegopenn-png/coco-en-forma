name: Coco Ajedrez rules and challenges
on:
  push:
    paths: ['games/ajedrez/**', 'qa/ajedrez.test.mjs', '.github/workflows/coco-ajedrez-tests.yml']
  pull_request:
    paths: ['games/ajedrez/**', 'qa/ajedrez.test.mjs', '.github/workflows/coco-ajedrez-tests.yml']
permissions:
  contents: read
jobs:
  chess:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test qa/ajedrez.test.mjs
