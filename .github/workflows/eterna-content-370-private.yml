name: Eterna 370 lessons real private verification
on:
  push:
    branches: ["qa/eterna-content-370-20260912"]
    paths: [".github/workflows/eterna-content-370-private.yml", "qa/content-370-private/**"]
permissions:
  contents: read
  actions: read
concurrency:
  group: eterna-content-370-private
  cancel-in-progress: false
jobs:
  verify-public-content-with-synthetic-identities:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_INPUT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          ref: 81bf9e7a46c67bb12638a941a1cd774ad3de14bc
          path: .qa-auth
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: f1f701f03ea39b9f052d145fcd169993245211f6
          path: .qa-combined
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with:
          name: eterna-content-370-build
          run-id: 34691808502
          github-token: ${{ github.token }}
          path: content-370-build
      - name: Repeat the full measured 906-test matrix and install locked tooling
        run: |
          mkdir -p content-370-private-evidence
          cd eterna-worker
          npm run check > ../content-370-private-evidence/regression.txt 2>&1
          tail -10 ../content-370-private-evidence/regression.txt
          grep -q '^# pass 906$' ../content-370-private-evidence/regression.txt
          grep -q '^# fail 0$' ../content-370-private-evidence/regression.txt
          npm ci --no-audit --no-fund
      - name: Match QA counters to the actual 906 passing tests and prepare scoped fixtures
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          r=json.loads(Path('content-370-build/report.json').read_text());assert r['tests_passed']==906 and r['tests_failed']==0
          for name in ['prepare.py','combine.mjs']:
            p=Path('qa/content-370-private')/name;s=p.read_text();assert '846' in s;p.write_text(s.replace('846','906'))
          PY
          python qa/content-370-private/prepare.py
          node --check qa/content-370-private/remote.generated.mjs
      - name: Check every new Infantil lesson, six modes and cleanup
        env: {ETERNA_QA_GROUP: '1'}
        run: node qa/content-370-private/remote.generated.mjs
      - name: Check every new Primaria lesson and preserve the no-repeat round fix
        env: {ETERNA_QA_GROUP: '2'}
        run: node qa/content-370-private/remote.generated.mjs
      - name: Check every new ESO lesson, six modes and cleanup
        env: {ETERNA_QA_GROUP: '3'}
        run: node qa/content-370-private/remote.generated.mjs
      - name: Check every new Bachillerato lesson, six modes and cleanup
        env: {ETERNA_QA_GROUP: '4'}
        run: node qa/content-370-private/remote.generated.mjs
      - name: Require every intended check, matching code and all four identity removals
        run: node qa/content-370-private/combine.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eterna-content-370-private
          path: content-370-private-evidence
          retention-days: 30
          if-no-files-found: warn
