name: Verify production web and PWA

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/production-web-pwa-smoke.yml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/production-web-pwa-smoke.yml"
      - "index.html"
      - "sw.js"
      - "coco-scoring-v160110.js"
      - "manifest.webmanifest"
      - "manifest.json"
      - "eterna-v159.js"
      - "eterna-experience-v160.js"
      - "eterna.html"
      - "eterna-captacion.html"
      - "eterna-landing-captacion-v1.html"
      - "coco-v141-runtime.js"
      - "coco-v142-runtime.js"
      - "coco-v152-pwa.js"
      - "coco-v153-fixes.js"
      - "coco-v155-identity.js"
      - ".github/release-eterna-1609920"

permissions:
  contents: read

concurrency:
  group: production-web-pwa-smoke
  cancel-in-progress: true

jobs:
  live-smoke:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APEX_URL: https://cocoenforma.com
      WWW_URL: https://www.cocoenforma.com
      WORKER_HEALTH_URL: https://coco-eterna-v159.chatinmobiliario.workers.dev/health
      EXPECTED_WORKER_VERSION: 160.99.24-contextual-dialogue
      EXPECTED_FRONTEND_VERSION: 160.99.25-contextual-dialogue
      EXPECTED_PWA_CACHE: coco-en-forma-v160.100.17-eterna-contextual-dialogue-r1
    steps:
      - name: Fetch uncached production assets
        shell: bash
        run: |
          set -euo pipefail
          stamp="${GITHUB_SHA}-$(date +%s)"
          fetch_live() {
            local url="$1"
            local output="$2"
            curl --fail --silent --show-error --location               --max-time 45 --retry 6 --retry-delay 3 --retry-all-errors               --header "Cache-Control: no-cache"               --header "Pragma: no-cache"               "${url}verify=${stamp}"               --output "$output"
          }
          worker_ready=0
          for attempt in {1..30}; do
            fetch_live "${WORKER_HEALTH_URL}?" /tmp/health.json
            if node -e '
              const fs = require("node:fs");
              try {
                const p = JSON.parse(fs.readFileSync("/tmp/health.json", "utf8"));
                process.exit(p.ok === true && p.version === process.env.EXPECTED_WORKER_VERSION ? 0 : 1);
              } catch { process.exit(1); }
            '; then
              worker_ready=1
              break
            fi
            sleep 15
          done
          if [[ "$worker_ready" -ne 1 ]]; then
            echo "Production Worker did not reach ${EXPECTED_WORKER_VERSION}" >&2
            cat /tmp/health.json >&2 || true
            exit 1
          fi
          web_ready=0
          for attempt in {1..40}; do
            fetch_live "${APEX_URL}/?" /tmp/apex.html
            fetch_live "${WWW_URL}/?" /tmp/www.html
            fetch_live "${APEX_URL}/sw.js?" /tmp/sw.js
            fetch_live "${APEX_URL}/manifest.webmanifest?" /tmp/manifest.webmanifest
            fetch_live "${APEX_URL}/eterna-v159.js?" /tmp/eterna-v159.js
            fetch_live "${APEX_URL}/eterna-experience-v160.js?" /tmp/eterna-experience-v160.js
            fetch_live "${APEX_URL}/coco-v152-pwa.js?" /tmp/coco-v152-pwa.js
            fetch_live "${APEX_URL}/coco-v155-identity.js?" /tmp/coco-v155-identity.js
            fetch_live "${APEX_URL}/coco-scoring-v160110.js?" /tmp/coco-scoring-v160110.js
            fetch_live "${APEX_URL}/eterna.html?" /tmp/eterna.html
            fetch_live "${APEX_URL}/eterna-captacion.html?" /tmp/eterna-captacion.html
            fetch_live "${APEX_URL}/eterna-landing-captacion-v1.html?" /tmp/eterna-landing-captacion-v1.html
            if grep -Fq "const CACHE_VERSION=\"${EXPECTED_PWA_CACHE}\"" /tmp/sw.js \
              && grep -Fq "${EXPECTED_FRONTEND_VERSION}" /tmp/eterna-v159.js \
              && grep -Fq 'eterna-v159.js?v=160114' /tmp/apex.html; then
              web_ready=1
              break
            fi
            sleep 15
          done
          if [[ "$web_ready" -ne 1 ]]; then
            echo "Production web did not reach ${EXPECTED_PWA_CACHE}" >&2
            head -n 3 /tmp/sw.js >&2 || true
            exit 1
          fi
          test "$(wc -c < /tmp/apex.html)" -gt 100000
          test "$(wc -c < /tmp/www.html)" -gt 100000

      - name: Verify exact production Worker
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const p = JSON.parse(fs.readFileSync("/tmp/health.json", "utf8"));
          const valid = p.ok === true
            && p.version === process.env.EXPECTED_WORKER_VERSION
            && p.ai_provider === "cloudflare"
            && p.features?.distinct_modes === true
            && p.features?.mode_contracts_v2 === true
            && p.features?.teacher_core_v1 === true
            && p.features?.cloudflare_speech_v1 === true
            && p.features?.cloudflare_moderation_fallback_v1 === true
            && p.features?.child_safeguarding_interrupt_v1 === true
            && p.features?.parental_authorization_gate === true
            && p.features?.deterministic_subject_intake_v1 === true
            && p.features?.standard_dialogue_repertoire_v1 === true
            && p.features?.contextual_comprehension_checks_v1 === true;
          if (!valid) {
            console.error(JSON.stringify(p, null, 2));
            process.exit(1);
          }
          console.log(`Worker live: ${p.version}`);
          NODE

      - name: Verify live web points to Eterna
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const read = path => fs.readFileSync(path, "utf8");
          const apex = read("/tmp/apex.html");
          const www = read("/tmp/www.html");
          const eterna = read("/tmp/eterna-v159.js");
          const pwa = read("/tmp/coco-v152-pwa.js");
          const experience = read("/tmp/eterna-experience-v160.js");
          const identity = read("/tmp/coco-v155-identity.js");
          const scoring = read("/tmp/coco-scoring-v160110.js");
          const publicPages = [
            read("/tmp/eterna.html"),
            read("/tmp/eterna-captacion.html"),
            read("/tmp/eterna-landing-captacion-v1.html")
          ].join("\n");
          const endpoint = "https://coco-eterna-v159.chatinmobiliario.workers.dev";
          const retiredPhotoSurface = [
            "data-et-camera", "data-et-file", 'accept="image/*"',
            "Haz una foto", "Foto, voz", "adjunta una foto",
            "Las fotos se procesan", "Permitir fotos de tareas", "📷", "📸"
          ];
          const checks = [
            ["apex manifest", apex.includes("manifest.webmanifest")],
            ["www manifest", www.includes("manifest.webmanifest")],
            ["apex Eterna runtime", apex.includes("eterna-v159.js")],
            ["www Eterna runtime", www.includes("eterna-v159.js")],
            ["Eterna production endpoint", apex.includes(endpoint) || www.includes(endpoint) || eterna.includes(endpoint)],
            ["Service Worker API", pwa.includes("serviceWorker")],
            ["Service Worker URL", pwa.includes("sw.js")],
            ["uncached Service Worker update", pwa.includes('updateViaCache:"none"')],
            ["explicit Service Worker refresh", pwa.includes("registration.update()")],
            ["six Eterna modes", ["homework", "ask", "review", "explain", "exam", "practice"].every(mode => eterna.includes(`${mode}:{`))],
            ["text composer", eterna.includes("data-et-input")],
            ["voice composer", eterna.includes("data-et-mic")],
            ["silent incomplete-response retry release", eterna.includes(process.env.EXPECTED_FRONTEND_VERSION)],
            ["restored Eterna launcher visual", identity.includes("share/eterna.png?v=160116")],
            ["balanced scoring runtime", apex.includes("coco-scoring-v160110.js?v=160111") && scoring.includes('var VERSION = "balanced-v1"')],
            ["balanced score ceiling", scoring.includes("var MAX_SCORE = 115")],
            ["eleven comparable games", scoring.includes('"verdadero", "futbol"')],
            ["photo controls retired", retiredPhotoSurface.every(token => !eterna.includes(token))],
            ["photo claims retired", retiredPhotoSurface.every(token => !experience.includes(token) && !identity.includes(token) && !publicPages.includes(token))]
          ];
          for (const [name, ok] of checks) console.log(`${ok ? "OK" : "MISSING"}: ${name}`);
          if (checks.some(([, ok]) => !ok)) process.exit(1);
          NODE

      - name: Verify PWA update and stale-cache eviction
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "const CACHE_VERSION=\"${EXPECTED_PWA_CACHE}\"" /tmp/sw.js
          grep -Fq 'k.startsWith(CACHE_PREFIX)&&k!==CACHE_VERSION' /tmp/sw.js
          grep -Fq 'caches.delete(k)' /tmp/sw.js
          grep -Fq 'self.skipWaiting()' /tmp/sw.js
          grep -Fq 'self.clients.claim()' /tmp/sw.js
          grep -Fq '__coco_release' /tmp/sw.js
          grep -Fq './coco-scoring-v160110.js' /tmp/sw.js
          node - <<'NODE'
          const fs = require("node:fs");
          const m = JSON.parse(fs.readFileSync("/tmp/manifest.webmanifest", "utf8"));
          if (m.name !== "Coco en Forma" || m.display !== "standalone") process.exit(1);
          if (!String(m.start_url || "").includes("source=pwa-v159")) process.exit(1);
          const sizes = new Set((m.icons || []).map(icon => icon.sizes));
          if (!sizes.has("192x192") || !sizes.has("512x512")) process.exit(1);
          console.log(`PWA live: ${process.env.EXPECTED_PWA_CACHE}`);
          NODE
