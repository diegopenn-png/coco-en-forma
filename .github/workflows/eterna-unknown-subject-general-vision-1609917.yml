name: Eterna unknown-subject general vision 160.99.17
on:
  push:
    branches: [fix/eterna-unknown-subject-general-vision-1609917]
permissions:
  contents: write
jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/eterna-unknown-subject-general-vision-1609917
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply unknown-subject general vision patch
        run: node qa/eterna/apply-unknown-subject-general-vision-1609917.mjs
      - name: Syntax
        run: node --check eterna-worker/src/index.js
      - name: Targeted physical-case regression
        run: node --test qa/eterna/unknown-subject-general-vision-1609917.test.mjs
      - name: Full Eterna regression
        run: node --test eterna-worker/test/*.test.mjs qa/*.test.mjs qa/eterna/*.test.mjs
      - name: Commit validated worker
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add eterna-worker/src/index.js
          git diff --cached --quiet && exit 0
          git commit -m "fix(eterna): route unknown-subject photos through general vision"
          git push origin HEAD:fix/eterna-unknown-subject-general-vision-1609917
