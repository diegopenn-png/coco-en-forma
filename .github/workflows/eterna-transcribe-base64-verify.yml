name: Eterna transcription base64 real-audio verification
on:
  push:
    branches: ["fix/eterna-transcribe-private-160990"]
    paths: ["qa/eterna/apply-transcribe-base64.mjs", ".github/workflows/eterna-transcribe-base64-verify.yml", "eterna-worker/test/transcribe-audio-contract.test.mjs"]
permissions:
  contents: write
concurrency:
  group: eterna-transcribe-private-probe
  cancel-in-progress: false
jobs:
  verify-before-production:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_INPUT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact transcription-only repair
        run: node qa/eterna/apply-transcribe-base64.mjs
      - name: Run regression including byte-exact audio and authorization gates
        shell: bash
        run: |
          set -o pipefail
          cd eterna-worker
          npm run check | tee ../transcribe-base64-regression.txt
      - name: Install tooling
        run: |
          npm ci --prefix eterna-worker --no-audit --no-fund
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak ffmpeg
      - name: Generate synthetic speech in four formats
        run: |
          mkdir -p qa/eterna/.transcribe-private
          espeak -v es -s 145 -w qa/eterna/.transcribe-private/speech.wav "Explica qué son los números primos. El siete es un número primo."
          ffmpeg -v error -y -i qa/eterna/.transcribe-private/speech.wav -c:a aac qa/eterna/.transcribe-private/speech.m4a
          ffmpeg -v error -y -i qa/eterna/.transcribe-private/speech.wav -c:a aac -movflags frag_keyframe+empty_moov+default_base_moof qa/eterna/.transcribe-private/speech.fragmented.m4a
          ffmpeg -v error -y -i qa/eterna/.transcribe-private/speech.wav -c:a libopus qa/eterna/.transcribe-private/speech.webm
      - name: Prepare isolated corrected provider preview
        run: node qa/eterna/transcribe-private-probe.mjs prepare
      - name: Upload without deploying production
        run: node qa/eterna/transcribe-private-probe.mjs upload
      - name: Transcribe actual synthetic audio
        run: node qa/eterna/transcribe-private-probe.mjs run
      - name: Require four successful meaningful transcriptions
        run: |
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const path='qa/eterna/.transcribe-private/report.json';
          const p=JSON.parse(readFileSync(path));
          assert.equal(p.production_unchanged,true);
          assert.equal(p.production_version,'86b2652a-1b01-4afa-84d4-00554ef1c979');
          assert.equal(p.source_sha256,'b62aaaedc07cbc2ada1e1410b675dc62c4d8fcd3b5b626e2e855e157e706e9c5');
          assert.equal(p.provider,'cloudflare');assert.equal(p.model,'@cf/openai/whisper-large-v3-turbo');
          assert.equal(p.results.length,4);
          for(const r of p.results){
            assert.equal(r.ok,true,JSON.stringify(r));assert.equal(r.status,200);
            const text=r.text.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
            assert.match(text,/numeros? primos?/);assert.match(text,/siete|7/);
          }
          p.phase='corrected-real-audio';p.all_audio_tests_passed=true;
          writeFileSync(path,JSON.stringify(p,null,2));
          console.log('PASS 4/4 real-audio transcriptions with expected Spanish content; production unchanged');
          JS
      - name: Commit only validated source to the isolated branch
        run: |
          test "$GITHUB_REF" = "refs/heads/fix/eterna-transcribe-private-160990"
          test "$(git diff --name-only)" = "eterna-worker/src/index.js"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- eterna-worker/src/index.js
          git commit -m "fix(eterna): encode Whisper Turbo input as byte-exact base64" -m "Validated against real Cloudflare inference in WAV, M4A, fragmented MP4 and WebM. 223 regression tests passed. Only transcription audio encoding changed; production not deployed."
          git push origin HEAD:refs/heads/fix/eterna-transcribe-private-160990
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';import{execFileSync}from'node:child_process';
          const path='qa/eterna/.transcribe-private/report.json',p=JSON.parse(readFileSync(path));
          p.source_commit=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          p.source_blob=execFileSync('git',['hash-object','eterna-worker/src/index.js'],{encoding:'utf8'}).trim();
          writeFileSync(path,JSON.stringify(p,null,2));
          JS
      - name: Preserve sanitized real-audio evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transcription-base64-verification
          path: |
            qa/eterna/.transcribe-private/report.json
            transcribe-base64-regression.txt
          retention-days: 7
          if-no-files-found: warn
