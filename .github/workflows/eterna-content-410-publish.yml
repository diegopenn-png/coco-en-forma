name: Publish verified forty non-duplicate Eterna lessons
on:
  push:
    branches: ["ops/eterna-content-410-publish-6796091"]
    paths: [".github/workflows/eterna-content-410-publish.yml", "qa/content-410-publish/promote.mjs"]
permissions:
  contents: read
  actions: read
concurrency:
  group: eterna-worker-production
  cancel-in-progress: false
jobs:
  guarded-content-promotion:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_INPUT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: eterna-content-410-proof
          run-id: 34693576169
          github-token: ${{ github.token }}
          path: .verified
      - name: Require full regression on the exact selected source and locked tooling
        run: |
          mkdir -p content-410-production-evidence
          node --check qa/content-410-publish/promote.mjs
          cd eterna-worker
          npm run check > ../content-410-production-evidence/regression.txt 2>&1
          tail -10 ../content-410-production-evidence/regression.txt
          grep -q '^# pass 991$' ../content-410-production-evidence/regression.txt
          grep -q '^# fail 0$' ../content-410-production-evidence/regression.txt
          grep -q '^# skipped 0$' ../content-410-production-evidence/regression.txt
          npm ci --no-audit --no-fund
      - name: Promote only the privately verified canonical version; preserve all other settings
        run: node qa/content-410-publish/promote.mjs
      - name: Preserve sanitized actual publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eterna-content-410-production
          path: content-410-production-evidence
          retention-days: 90
          if-no-files-found: warn
