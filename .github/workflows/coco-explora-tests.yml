name: Coco Eneagrama questionnaire and PDF checks
on:
  push:
    paths: ['explora/**', 'qa/explora/**', '.github/coco-eneagrama/**', '.github/workflows/coco-explora-tests.yml']
  pull_request:
    paths: ['explora/**', 'qa/explora/**', '.github/coco-eneagrama/**', '.github/workflows/coco-explora-tests.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test qa/explora/engine.test.mjs
      - run: npm install --prefix /tmp/explora-dom --ignore-scripts --no-audit --no-fund jsdom@26.1.0
      - run: COCO_JSDOM_PATH=/tmp/explora-dom/node_modules/jsdom node qa/explora/ui.test.cjs
