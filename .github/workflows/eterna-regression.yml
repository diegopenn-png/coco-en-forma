name: Eterna regression

on:
  pull_request:
    paths:
      - "eterna-*.js"
      - "eterna-worker/**"
      - "coco-v153-fixes.js"
      - "index.html"
      - "sw.js"
      - ".github/workflows/eterna-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  six-modes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Worker and regression matrix
        working-directory: eterna-worker
        run: npm run check
      - name: Check client and Service Worker syntax
        run: |
          node --check eterna-v159.js
          node --check eterna-experience-v160.js
          node --check eterna-hotfix-v160902.js
          node --check coco-v153-fixes.js
          node --check sw.js
