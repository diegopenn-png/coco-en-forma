name: Deploy Coco Eneagrama payments
on:
  push:
    branches: [main]
    paths: ['.github/release-coco-eneagrama-15']
permissions:
  contents: read
concurrency:
  group: eterna-worker-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_INPUT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: eterna-worker/package-lock.json
      - name: Prepare existing deployment credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          clean_token="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          echo "::add-mask::$clean_token"
          echo "CLOUDFLARE_API_TOKEN=$clean_token" >> "$GITHUB_ENV"
          account_id="${CLOUDFLARE_ACCOUNT_INPUT#https://dash.cloudflare.com/}"
          account_id="${account_id%%/*}"
          [[ "$account_id" =~ ^[0-9a-fA-F]{32}$ ]]
          echo "::add-mask::$account_id"
          echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"
      - run: npm ci --no-audit --no-fund
        working-directory: eterna-worker
      - run: npm run check
        working-directory: eterna-worker
      - run: node --test qa/explora/engine.test.mjs qa/explora/coaching.test.mjs
      - name: Upload candidate preserving existing settings and secrets
        working-directory: eterna-worker
        shell: bash
        run: |
          npx wrangler versions upload --name coco-eterna-v159 --keep-vars | tee /tmp/eneagrama-candidate.log
          version_id="$(sed -n -E 's/^(Worker )?Version ID: //p' /tmp/eneagrama-candidate.log | tail -1)"
          preview_url="$(sed -n 's/^Version Preview URL: //p' /tmp/eneagrama-candidate.log | tail -1)"
          [[ "$version_id" =~ ^[0-9a-f-]{36}$ ]]
          [[ "$preview_url" =~ ^https://[0-9a-f-]+-coco-eterna-v159\.chatinmobiliario\.workers\.dev$ ]]
          echo "CANDIDATE_VERSION=$version_id" >> "$GITHUB_ENV"
          curl --fail --silent --show-error "$preview_url/health" > /tmp/eneagrama-health.json
          node -e 'const d=require("/tmp/eneagrama-health.json");if(!d.eneagrama_payments||d.eneagrama_report_version!=="2026-10-31-coaching-3"||!d.supabase_configured||!d.stripe_configured)process.exit(1)'
          status="$(curl --silent --output /tmp/eneagrama-denied.json --write-out '%{http_code}' -H 'Origin: https://cocoenforma.com' "$preview_url/v1/eneagrama/access")"
          test "$status" = 401
      - name: Deploy verified candidate
        working-directory: eterna-worker
        run: npx wrangler versions deploy "$CANDIDATE_VERSION@100%" --name coco-eterna-v159 --message 'Coco Eneagrama coaching references and signature v3' --yes
      - name: Verify production
        run: |
          for attempt in {1..12}; do
            curl --fail --silent --show-error --header 'Cache-Control: no-cache' "https://coco-eterna-v159.chatinmobiliario.workers.dev/health?verify=${GITHUB_SHA}-${attempt}" > /tmp/eneagrama-live.json
            if node -e 'const d=require("/tmp/eneagrama-live.json");console.log({eneagrama:d.eneagrama_payments,auth:d.supabase_configured,stripe:d.stripe_configured});if(!d.eneagrama_payments||d.eneagrama_report_version!=="2026-10-31-coaching-3"||!d.supabase_configured||!d.stripe_configured)process.exit(1)'; then
              exit 0
            fi
            sleep 5
          done
          exit 1
