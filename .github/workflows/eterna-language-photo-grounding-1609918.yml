name: Eterna language photo grounding 160.99.18

on:
  push:
    branches:
      - fix/eterna-language-photo-grounding-1609918

permissions:
  contents: write

concurrency:
  group: eterna-language-photo-grounding-1609918
  cancel-in-progress: false

jobs:
  apply-test-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/eterna-language-photo-grounding-1609918

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: eterna-worker/package-lock.json

      - name: Apply exact 160.99.18 patch
        shell: bash
        env:
          ETERNA_PATCH_GZIP_BASE64: 
        run: |
          printf '%s' "$ETERNA_PATCH_GZIP_BASE64" | base64 -d | gzip -d > /tmp/eterna-1609918.patch
          git apply --check /tmp/eterna-1609918.patch
          git apply --index /tmp/eterna-1609918.patch
          git diff --cached --check

      - name: Verify exact release markers
        shell: bash
        run: |
          grep -F '160.99.18-language-photo-grounding' eterna-worker/src/index.js
          grep -F '"version": "160.99.18"' eterna-worker/package.json
          grep -F 'language_photo_grounding_v1:true' eterna-worker/src/index.js
          grep -F 'EXPECTED_VERSION: 160.99.18-language-photo-grounding' .github/workflows/eterna-worker-production-1609918.yml
          test -f .github/release-eterna-1609918

      - name: Install Worker tooling
        working-directory: eterna-worker
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Full Eterna regression
        shell: bash
        run: |
          timeout --signal=TERM --kill-after=30s 14m \
            node --test eterna-worker/test/*.test.mjs qa/*.test.mjs qa/eterna/*.test.mjs

      - name: Commit validated release and remove coordinator
        shell: bash
        run: |
          git rm .github/workflows/eterna-language-photo-grounding-1609918.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix(eterna): ground clear language worksheet photos"
          git push origin HEAD:fix/eterna-language-photo-grounding-1609918
