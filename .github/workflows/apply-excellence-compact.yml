name: Apply excellence compact cards
on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
permissions:
  contents: write
jobs:
  apply:
    if: github.head_ref == 'feat/coco-eterna-excellence-160934'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/coco-eterna-excellence-160934
      - name: Apply reviewed compact-card patch
        shell: bash
        run: |
          if grep -F 'coco-excellence-v160934.js?v=1609342' index.html >/dev/null; then
            echo "Compact-card patch already applied"
            exit 0
          fi
          printf '%s' '' | base64 --decode > /tmp/excellence-compact.patch
          git apply --check /tmp/excellence-compact.patch
          git apply /tmp/excellence-compact.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "fix: render excellence metadata on compact cards"
          git push origin HEAD:feat/coco-eterna-excellence-160934
