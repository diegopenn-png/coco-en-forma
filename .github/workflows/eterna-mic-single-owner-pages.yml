name: Publish verified microphone single-owner repair
on:
  push:
    branches: ["ops/eterna-mic-single-owner-pages-5c78a4d"]
    paths: [".github/workflows/eterna-mic-single-owner-pages.yml"]
permissions:
  contents: read
  pages: write
jobs:
  existing-pages-source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish exact main and verify all three audio/cache assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          node --input-type=module <<'JS'
          import{writeFileSync}from'node:fs';import{createHash}from'node:crypto';import assert from'node:assert/strict';
          const expected='5c78a4d660ef4db17aeb7f80c6156ab219933e05';
          const report={commit:expected,version:'coco-en-forma-v160.99.2-mic-single-owner-r1',phase:'pending',backend_changed:false};
          const save=()=>writeFileSync('mic-single-owner-pages-report.json',JSON.stringify(report,null,2));save();
          async function api(path,method='GET'){const r=await fetch(`https://api.github.com/repos/${process.env.GH_REPO}/${path}`,{method,headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},signal:AbortSignal.timeout(25000)});const p=await r.json();if(!r.ok)throw Error(`GitHub ${method} ${path}: ${r.status} ${p.message||''}`);return p}
          const wait=ms=>new Promise(r=>setTimeout(r,ms));
          try{
            assert.equal((await api('git/ref/heads/main')).object.sha,expected,'Main changed; do not publish another revision');
            const site=await api('pages');assert.equal(site.source.branch,'main');assert.equal(site.source.path,'/');report.pages_source_unchanged=true;
            const previous=await api('pages/builds/latest');
            if(previous.commit!==expected)report.build_request=await api('pages/builds','POST');
            save();let ready=false;
            for(let i=0;i<60;i++){
              const b=await api('pages/builds/latest');report.last_build={commit:b.commit,status:b.status,url:b.url};save();
              if(b.commit===expected&&b.status==='built'){ready=true;break}
              if(b.commit===expected&&b.status==='errored')throw Error('Target Pages build failed');
              await wait(5000)
            }
            assert.equal(ready,true,'Expected Pages build has not completed');
            const expectedAssets={'sw.js':'ec48f757e372f087a7bb27658bcebb4b8e066455a9dc620d67fb6c6b9e19a81d','eterna-mic-only-v4.js':'7cc892abd2d4050b73766c508dd08a949374e3e7f189089fc52a31b10e986861','eterna-voice-autocut-v160907.js':'c45edff7e65adbffbe4543fd410f1d18e44d0c44872958398251fa08f66b4236'};
            report.assets={};
            for(const[path,hash]of Object.entries(expectedAssets)){
              let delivered=false;
              for(let i=0;i<12;i++){
                const r=await fetch(`https://cocoenforma.com/${path}?__coco_release=${report.version}&verify=${expected}-${i}`,{headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(20000)});
                const actual=createHash('sha256').update(Buffer.from(await r.arrayBuffer())).digest('hex');
                if(r.ok&&actual===hash){report.assets[path]={sha256:actual,exact_match:true};delivered=true;break}
                await wait(3000)
              }
              assert.equal(delivered,true,`Public ${path} does not yet match tested bytes`)
            }
            assert.equal((await api('git/ref/heads/main')).object.sha,expected);
            report.phase='published-and-delivery-verified';report.verified_at=new Date().toISOString();save();console.log(JSON.stringify(report));
          }catch(e){report.phase='not-ready';report.error=String(e.message).slice(0,400);save();throw e}
          JS
      - name: Preserve publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mic-single-owner-pages-publication
          path: mic-single-owner-pages-report.json
          retention-days: 14
          if-no-files-found: warn
