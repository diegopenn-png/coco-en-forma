name: Publish verified Eterna next-round repetition fix
on:
  push:
    branches: ["ops/eterna-next-round-publish-c26c61c"]
    paths: [".github/workflows/eterna-next-round-publish.yml", "qa/next-round/publish_verified.mjs"]
permissions:
  contents: read
  actions: read
concurrency:
  group: eterna-worker-production
  cancel-in-progress: false
jobs:
  promote-exact-private-version:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_INPUT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
      PUBLISH_COMMIT: c26c61cd78fa2b045a5e63efd81901581603cdeb
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/download-artifact@v4
        with:
          name: eterna-next-round-fix-proof
          run-id: 34690321214
          github-token: ${{ github.token }}
          path: .proof
      - name: Repeat all tests on the exact selected source
        run: |
          mkdir -p next-round-production
          node --check qa/next-round/publish_verified.mjs
          cd eterna-worker
          npm run check > ../next-round-production/regression.txt 2>&1
          tail -10 ../next-round-production/regression.txt
          grep -q '^# pass 779$' ../next-round-production/regression.txt
          grep -q '^# fail 0$' ../next-round-production/regression.txt
          npm ci --no-audit --no-fund
      - name: Promote only the tested version with every binding unchanged
        run: node qa/next-round/publish_verified.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eterna-next-round-production
          path: next-round-production
          retention-days: 90
          if-no-files-found: warn
