name: Eterna full-stack QA preview

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "eterna-*.js"
      - "eterna-*.css"
      - "eterna-worker/**"
      - "coco-*.js"
      - "index.html"
      - "sw.js"
      - "qa/eterna/**"
      - ".github/workflows/eterna-full-preview.yml"

permissions:
  contents: read

concurrency:
  group: eterna-full-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_INPUT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: coco-en-forma-eterna-qa
      PAGES_BRANCH: six-modes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Cloudflare secrets
        shell: bash
        run: |
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_INPUT:-}" ]]; then
            echo "Cloudflare preview credentials are not configured" >&2
            exit 1
          fi
          clean_token="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          account_id="${CLOUDFLARE_ACCOUNT_INPUT#https://dash.cloudflare.com/}"
          account_id="${account_id%%/*}"
          if [[ -z "$clean_token" || ! "$account_id" =~ ^[0-9a-fA-F]{32}$ ]]; then
            echo "Cloudflare preview credentials are invalid" >&2
            exit 1
          fi
          echo "::add-mask::$clean_token"
          echo "::add-mask::$account_id"
          echo "CLOUDFLARE_API_TOKEN=$clean_token" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"

      - name: Run complete regression
        shell: bash
        run: |
          cd eterna-worker
          npm install --no-audit --no-fund
          npm run check
          cd ..
          node --check eterna-state-contract-v3.js
          node --check eterna-v159.js
          node --check eterna-experience-v160.js
          node --check coco-v153-fixes.js
          node --check sw.js
          node qa/eterna-trial-expired-ui-contract.test.mjs
          node --test qa/eterna/offline/*.test.mjs
          node qa/eterna/run-matrix.mjs --offline

      - name: Upload isolated Worker version
        working-directory: eterna-worker
        shell: bash
        run: |
          allowed_origins="https://${PAGES_PROJECT}.pages.dev,https://${PAGES_BRANCH}.${PAGES_PROJECT}.pages.dev,https://www.cocoenforma.com,https://cocoenforma.com"
          npx wrangler versions upload \
            --name coco-eterna-v159 \
            --keep-vars \
            --var "ALLOWED_ORIGINS:${allowed_origins}" | tee ../worker-preview.log
          preview_url="$(sed -n 's/^Version Preview URL: //p' ../worker-preview.log | tail -1)"
          if [[ ! "$preview_url" =~ ^https:// ]]; then
            echo "Worker preview URL was not produced" >&2
            exit 1
          fi
          echo "ETERNA_WORKER_PREVIEW=$preview_url" >> "$GITHUB_ENV"

      - name: Prepare no-index frontend preview
        shell: bash
        run: |
          mkdir -p preview-site
          rsync -a ./ preview-site/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude 'eterna-worker/node_modules' \
            --exclude 'preview-site'
          ETERNA_WORKER_PREVIEW="$ETERNA_WORKER_PREVIEW" node - <<'NODE'
          const fs = require('node:fs');
          const path = 'preview-site/index.html';
          const production = 'https://coco-eterna-v159.chatinmobiliario.workers.dev';
          const preview = process.env.ETERNA_WORKER_PREVIEW;
          const source = fs.readFileSync(path, 'utf8');
          if (!source.includes(production)) throw new Error('Production Worker endpoint was not found');
          fs.writeFileSync(path, source.replace(production, preview));
          NODE
          printf '/*\n  X-Robots-Tag: noindex, nofollow, noarchive\n  Cache-Control: no-store\n' > preview-site/_headers
          printf 'User-agent: *\nDisallow: /\n' > preview-site/robots.txt

      - name: Ensure Pages preview project
        shell: bash
        run: |
          npx wrangler pages project create "$PAGES_PROJECT" \
            --production-branch "$PAGES_BRANCH" >/tmp/pages-create.log 2>&1 || true

      - name: Deploy isolated frontend preview
        shell: bash
        run: |
          npx wrangler pages deploy preview-site \
            --project-name "$PAGES_PROJECT" \
            --branch "$PAGES_BRANCH" \
            --commit-hash "${{ github.event.pull_request.head.sha || github.sha }}" | tee pages-preview.log
          deployment_url="$(sed -n 's/.*Take a peek over at \(https:\/\/[^ ]*\).*/\1/p' pages-preview.log | tail -1)"
          if [[ ! "$deployment_url" =~ ^https:// ]]; then
            echo "Pages preview URL was not produced" >&2
            exit 1
          fi
          echo "ETERNA_PAGES_DEPLOYMENT=$deployment_url" >> "$GITHUB_ENV"
          echo "ETERNA_FRONTEND_PREVIEW=https://${PAGES_PROJECT}.pages.dev" >> "$GITHUB_ENV"

      - name: Verify preview health and assets
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            "$ETERNA_WORKER_PREVIEW/health" | tee worker-health.json
          grep -q '160.92.0-six-modes-state-contract-v3' worker-health.json
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            "$ETERNA_FRONTEND_PREVIEW/" | grep -q 'eterna-state-contract-v3.js?v=160920'

      - name: Preserve preview coordinates
        shell: bash
        run: |
          {
            echo "worker=$ETERNA_WORKER_PREVIEW"
            echo "frontend=$ETERNA_FRONTEND_PREVIEW"
            echo "deployment=$ETERNA_PAGES_DEPLOYMENT"
            echo "head=${{ github.event.pull_request.head.sha || github.sha }}"
          } | tee eterna-full-preview.txt

      - uses: actions/upload-artifact@v4
        with:
          name: eterna-full-preview-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            eterna-full-preview.txt
            worker-health.json
          if-no-files-found: error
          retention-days: 7
