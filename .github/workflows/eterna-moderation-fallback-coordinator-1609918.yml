name: Eterna moderation fallback coordinator 160.99.18

on:
  push:
    branches:
      - fix/eterna-dependency-probe-1609918

permissions:
  contents: write

concurrency:
  group: eterna-moderation-fallback-1609918
  cancel-in-progress: false

jobs:
  apply-test-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/eterna-dependency-probe-1609918

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: eterna-worker/package-lock.json

      - name: Apply exact moderation fallback patch
        shell: bash
        run: |
          base64 -d .github/eterna-moderation-fallback-1609918.patch.gz.b64 | gzip -d > /tmp/eterna-moderation-fallback-1609918.patch
          git apply --check /tmp/eterna-moderation-fallback-1609918.patch
          git apply --index /tmp/eterna-moderation-fallback-1609918.patch
          git diff --cached --check

      - name: Verify exact fallback markers
        shell: bash
        run: |
          grep -F 'cloudflare_moderation_fallback_v1:true' eterna-worker/src/index.js
          grep -F 'MODERATION_FALLBACK_MODEL' eterna-worker/wrangler.jsonc
          grep -F 'text moderation uses a distinct Cloudflare fallback before OpenAI' eterna-worker/test/latency-contract.test.mjs

      - name: Install Worker tooling
        working-directory: eterna-worker
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Full Eterna regression
        shell: bash
        run: |
          timeout --signal=TERM --kill-after=30s 14m \
            node --test eterna-worker/test/*.test.mjs qa/*.test.mjs qa/eterna/*.test.mjs

      - name: Commit validated moderation fallback
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix(eterna): add resilient Cloudflare moderation fallback"
          git push origin HEAD:fix/eterna-dependency-probe-1609918
