name: Eterna exercise factory real integration verification
on:
  push:
    branches: ["qa/eterna-sprint-integration-20260912"]
    paths: [".github/workflows/eterna-sprint-private.yml", "qa/sprint/prepare_private.py", "qa/sprint/private_turns.mjs", "qa/sprint/combine_private.mjs", "qa/sprint/browser_flow.py", "qa/sprint/browser_bridge.mjs"]
permissions:
  contents: read
  actions: read
concurrency:
  group: eterna-sprint-private
  cancel-in-progress: false
jobs:
  final-real-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_INPUT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          ref: 81bf9e7a46c67bb12638a941a1cd774ad3de14bc
          path: .qa-auth
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: f1f701f03ea39b9f052d145fcd169993245211f6
          path: .qa-combined
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with:
          name: eterna-sprint-build
          run-id: 34682508300
          github-token: ${{ github.token }}
          path: sprint-build-evidence
      - name: Recheck exact code, full regression and locked tools
        run: |
          mkdir -p sprint-private-evidence
          cd eterna-worker
          npm run check > ../sprint-private-evidence/regression.txt 2>&1
          tail -10 ../sprint-private-evidence/regression.txt
          grep -q '^# pass 753$' ../sprint-private-evidence/regression.txt
          grep -q '^# fail 0$' ../sprint-private-evidence/regression.txt
          npm ci --no-audit --no-fund
      - name: Install isolated browser test tooling
        run: |
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Use actual client and Worker in browser with synthetic database only
        run: python qa/sprint/browser_flow.py
      - name: Prepare expiring synthetic identities and canonical candidate
        run: |
          python qa/sprint/prepare_private.py
          node --check qa/sprint/remote_private.generated.mjs
          node --check qa/sprint/combine_private.mjs
      - name: Real first six families, both modes, identity 1 cleanup
        env: {ETERNA_QA_GROUP: '1'}
        run: node qa/sprint/remote_private.generated.mjs
      - name: Real next six families, both modes, identity 2 cleanup
        env: {ETERNA_QA_GROUP: '2'}
        run: node qa/sprint/remote_private.generated.mjs
      - name: Real next six families, both modes, identity 3 cleanup
        env: {ETERNA_QA_GROUP: '3'}
        run: node qa/sprint/remote_private.generated.mjs
      - name: Remaining families, preserved curated modes and protocols; identity 4 cleanup
        env: {ETERNA_QA_GROUP: '4'}
        run: node qa/sprint/remote_private.generated.mjs
      - name: Require identical canonical code, all families, UI, public compass and all cleanups
        run: node qa/sprint/combine_private.mjs
      - name: Preserve sanitized real integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eterna-sprint-private
          path: |
            sprint-private-evidence
            sprint-ui-evidence
          retention-days: 30
          if-no-files-found: warn
